          <textarea id="ipa" placeholder="IP manzillar (vergul yoki yangi qator bilan):&#10;192.168.1.64" onchange="save()"></textarea>
          <div class="row"><input id="prt" placeholder="Port (80)" inputmode="numeric" onchange="save()"><input id="chs" placeholder="Kanallar: 1,2,3,4 yoki 1-16" onchange="save()"></div>
          <input id="usr" placeholder="Kamera / NVR logini (admin)" autocapitalize="off" onchange="save()">
          <input id="pwd" type="password" placeholder="Kamera / NVR paroli" onchange="save()">
          <textarea id="ipu" placeholder="Faqat 'Boshqa' uchun URLlar" onchange="save()"></textarea>
          <button onclick="testIp()" style="width:100%;margin-top:6px">Barcha NVR / IP kanallarni tekshirish</button><div class="st" id="s3"></div>
          <img id="pv" class="hide" style="width:100%;border-radius:12px;margin-top:8px"></div>

          <div class="card"><h2>🔔 Qo‘shimcha va sezgirlik</h2>
          <label class="sw">⚡ Quvvat (220V/zaryad) uzilishi xabari<input type="checkbox" id="fpower" onchange="save()"></label>
          <label class="sw">💚 Har 1 soatda «Tizim ishlayapti» xabari<input type="checkbox" id="fheartbeat" onchange="save()"></label>
