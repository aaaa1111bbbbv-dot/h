              private fun sendTelegramVideoDirect(videoFile: File, caption: String): Boolean {
                  if (tok.isEmpty() || cid.isEmpty() || !videoFile.exists()) return false
                  return try {
                      val body = MultipartBody.Builder()
                          .setType(MultipartBody.FORM)
                          .addFormDataPart("chat_id", cid)
                          .addFormDataPart("caption", caption)
                          .addFormDataPart("supports_streaming", "true")
                          .addFormDataPart("video", videoFile.name, videoFile.asRequestBody("video/mp4".toMediaType()))
                          .build()
                      val req = Request.Builder().url("https://api.telegram.org/bot$tok/sendVideo").post(body).build()
                      tgClient.newCall(req).execute().use { it.isSuccessful }
                  } catch (_: Exception) {
                      false
                  }
              }

              private fun startTelegramBotLoop() {
                  if (tok.isEmpty() || cid.isEmpty()) return
                  if (!botLoopRunning.compareAndSet(false, true)) return
                  botPollExecutor.execute {
                      var offset = SecureStore.getLastUpdateId(this)
                      while (botLoopRunning.get() && tok.isNotEmpty() && cid.isNotEmpty()) {
                          try {
                              val req = Request.Builder()
                                  .url("https://api.telegram.org/bot$tok/getUpdates?timeout=20&offset=${offset + 1}")
                                  .build()
                              botLongPollClient.newCall(req).execute().use { resp ->
                                  if (resp.isSuccessful) {
                                      val root = JSONObject(resp.body?.string() ?: "")
                                      if (root.optBoolean("ok", false)) {
                                          val arr = root.optJSONArray("result") ?: JSONArray()
                                          for (i in 0 until arr.length()) {
                                              val upd = arr.optJSONObject(i) ?: continue
                                              val uid = upd.optLong("update_id", 0L)
                                              if (uid > offset) {
                                                  offset = uid
                                                  SecureStore.setLastUpdateId(this, offset)
                                              }
                                              val msg = upd.optJSONObject("message") ?: continue
                                              val chatObj = msg.optJSONObject("chat") ?: continue
                                              val fromChatId = chatObj.optLong("id", 0L).toString()
                                              val text = msg.optString("text", "").trim()
                                              if (fromChatId == cid && text.startsWith("/")) {
                                                  handleTelegramCommand(text.lowercase(Locale.ROOT))
                                              }
                                          }
                                      }
                                  } else {
                                      Thread.sleep(3000L)
                                  }
                              }
                          } catch (_: Exception) {
                              try {
                                  Thread.sleep(4000L)
                              } catch (_: Exception) {
                              }
                          }
                      }
                      botLoopRunning.set(false)
                  }
              }

              private fun handleTelegramCommand(fullCmd: String) {
                  val parts = fullCmd.split(Regex("\\s+"))
                  val cmd = parts[0]
                  when (cmd) {
                      "/rasm", "/photo" -> {
                          pushEvent("bot", "Telegram buyrug‘i: /rasm")
                          if (srcMode == "phone") {
                              if (active && cameraProvider != null) pendingShotNow.set(true)
                              else latestFullJpeg.get()?.let { sendOrQueuePhoto(it, "📸 Oxirgi kadr") }
                          } else {
                              for ((key, bytes) in lastChannelJpeg) {
                                  val lbl = targets.firstOrNull { it.key == key }?.label ?: key
                                  sendOrQueuePhoto(bytes, "📸 $lbl")
                              }
                          }
                      }
                      "/video" -> {
                          pushEvent("bot", "Telegram buyrug‘i: /video")
                          if (!active || manualStopped) {
                              sendOrQueueText("⚠️ Nazorat o‘chiq. Avval /yoq yuboring.")
                          } else {
                              sendOrQueueText("🎥 ${videoClipSec} soniyali video yozilmoqda...")
                              triggerDangerEpisode("Telegram /video buyrug‘i", null, latestFullJpeg.get())
                          }
                      }
                      "/interval" -> {
                          val sec = parts.getOrNull(1)?.toIntOrNull()
                          if (sec != null && sec in 1..60) {
                              alertPhotoIntervalSec = sec
                              val cfg = SecureStore.loadConfig(this)
                              cfg.put("alertPhotoIntervalSec", sec)
                              SecureStore.saveConfigJson(this, cfg.toString())
                              sendOrQueueText("✅ Xavf vaqtida rasm olish oralig‘i: har $sec soniyada 1 ta rasm.")
                          } else {
                              sendOrQueueText("ℹ️ Hozirgi rasm oralig‘i: ${alertPhotoIntervalSec}s.\nO‘zgartirish uchun: /interval 1 yoki /interval 5")
                          }
                      }
                      "/holat", "/status" -> {
                          val pct = batteryPercent()
                          val qSize = OfflineQueue.size(this)
                          val offlineCams = channelOffline.filter { it.value }.keys.joinToString(", ").ifEmpty { "yo‘q" }
                          val report = buildString {
                              appendLine("📊 Qo‘riqlash holati:")
                              appendLine("• Rejim: ${if (active && !manualStopped) "FAOL" else "O‘CHIQ"}")
                              appendLine("• Xavf rasmi oralig‘i: har ${alertPhotoIntervalSec}s da 1 ta (Zoom: ${if (fautoZoom) "yoqiq" else "o‘chiq"})")
                              appendLine("• Bugun kirdi: $countEnterToday | Chiqdi: $countExitToday")
                              appendLine("• Oxirgi tanilgan: ${lastRecognizedPerson.ifEmpty { "yo‘q" }}")
                              appendLine("• Uzilgan kanallar: $offlineCams")
                              appendLine("• Batareya: $pct% | Oflayn navbat: $qSize")
                          }
                          sendOrQueueText(report)
                      }
                      "/yoq", "/on" -> {
                          pushEvent("bot", "Telegram buyrug‘i: /yoq")
                          SecureStore.setWasRunning(this, true)
                          handler.post {
                              startService(Intent(this, MonitorForegroundService::class.java).apply {
                                  action = ACTION_RESTORE
                                  putExtra("reason", "telegram_cmd")
                              })
                          }
                          sendOrQueueText("✅ Qo‘riqlash nazorati yoqildi.")
                      }
                      "/ochir", "/off" -> {
                          pushEvent("bot", "Telegram buyrug‘i: /ochir")
                          sendOrQueueText("⏹ Qo‘riqlash nazorati to‘xtatildi.")
                          handler.post { stopAll(byUser = true) }
                      }
                      "/start", "/yordam", "/help" -> {
                          sendOrQueueText(
                              "🤖 Qo‘riqlash bot buyruqlari:\n" +
                                  "/rasm — Hozirgi kadr\n" +
                                  "/video — 10 soniyali video yozish\n" +
                                  "/interval 1 — Xavfda har 1s (yoki 5s) rasm olish\n" +
                                  "/holat — Kirim-chiqim, kamera va batareya holati\n" +
                                  "/yoq — Nazoratni yoqish\n" +
                                  "/ochir — Nazoratni to‘xtatish"
                          )
                      }
                  }
              }

              private fun updateNotif(text: String) {
                  val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                  nm.notify(NOTIF_ID, buildNotif(text))
              }

              private fun buildNotif(text: String): Notification {
                  val openIntent = Intent(this, MainActivity::class.java)
                  val pi = PendingIntent.getActivity(this, 0, openIntent, PendingIntent.FLAG_UPDATE_CURRENT or PendingIntent.FLAG_IMMUTABLE)
                  return NotificationCompat.Builder(this, CHANNEL_ID)
                      .setContentTitle("Qo‘riqlash · AQLLI HIMOYA")
                      .setContentText(text)
                      .setSmallIcon(android.R.drawable.ic_menu_camera)
                      .setContentIntent(pi)
                      .setOngoing(true)
                      .build()
              }

              private fun createChannel() {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                      val ch = NotificationChannel(CHANNEL_ID, "Qo‘riqlash himoya xizmati", NotificationManager.IMPORTANCE_LOW)
                      val nm = getSystemService(Context.NOTIFICATION_SERVICE) as NotificationManager
                      nm.createNotificationChannel(ch)
                  }
              }
          }
