          package uz.qoriqlash.app

          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.media.MediaCodec
          import android.media.MediaCodecInfo
          import android.media.MediaFormat
          import android.media.MediaMuxer
          import java.io.File

          object JpegToMp4Encoder {

              fun encodeFramesToMp4(jpegFrames: List<ByteArray>, outFile: File, fps: Int = 4): Boolean {
                  if (jpegFrames.size < 2) return false
                  val firstBmp = BitmapFactory.decodeByteArray(jpegFrames[0], 0, jpegFrames[0].size) ?: return false
                  val width = ((firstBmp.width.coerceAtMost(960)) / 16) * 16
                  val height = ((firstBmp.height.coerceAtMost(720)) / 16) * 16
                  firstBmp.recycle()
                  if (width < 64 || height < 64) return false

                  var codec: MediaCodec? = null
                  var muxer: MediaMuxer? = null
                  var muxerStarted = false
                  var trackIndex = -1

                  return try {
                      val format = MediaFormat.createVideoFormat(MediaFormat.MIMETYPE_VIDEO_AVC, width, height).apply {
                          setInteger(MediaFormat.KEY_COLOR_FORMAT, MediaCodecInfo.CodecCapabilities.COLOR_FormatYUV420Flexible)
                          setInteger(MediaFormat.KEY_BIT_RATE, 1_200_000)
                          setInteger(MediaFormat.KEY_FRAME_RATE, fps)
                          setInteger(MediaFormat.KEY_I_FRAME_INTERVAL, 1)
                      }

                      codec = MediaCodec.createEncoderByType(MediaFormat.MIMETYPE_VIDEO_AVC)
                      codec.configure(format, null, null, MediaCodec.CONFIGURE_FLAG_ENCODE)
                      codec.start()

                      if (outFile.exists()) outFile.delete()
                      muxer = MediaMuxer(outFile.absolutePath, MediaMuxer.OutputFormat.MUXER_OUTPUT_MPEG_4)

                      val bufferInfo = MediaCodec.BufferInfo()
                      val frameDurationUs = 1_000_000L / fps.coerceAtLeast(1)

                      for (i in jpegFrames.indices) {
                          val rawBmp = BitmapFactory.decodeByteArray(jpegFrames[i], 0, jpegFrames[i].size) ?: continue
                          val scaled = if (rawBmp.width != width || rawBmp.height != height) {
                              Bitmap.createScaledBitmap(rawBmp, width, height, true).also { rawBmp.recycle() }
                          } else {
                              rawBmp
                          }
                          val yuv = bitmapToNv12(scaled, width, height)
                          scaled.recycle()

                          val inIdx = codec.dequeueInputBuffer(10_000L)
                          if (inIdx >= 0) {
                              val inBuf = codec.getInputBuffer(inIdx)
                              inBuf?.clear()
                              inBuf?.put(yuv)
                              codec.queueInputBuffer(inIdx, 0, yuv.size, i * frameDurationUs, 0)
                          }
                          drainEncoder(codec, muxer, bufferInfo, false, { trackIndex }, { trackIndex = it }, { muxerStarted }, { muxerStarted = it })
                      }

                      val eosIdx = codec.dequeueInputBuffer(10_000L)
                      if (eosIdx >= 0) {
                          codec.queueInputBuffer(eosIdx, 0, 0, jpegFrames.size * frameDurationUs, MediaCodec.BUFFER_FLAG_END_OF_STREAM)
                      }
                      drainEncoder(codec, muxer, bufferInfo, true, { trackIndex }, { trackIndex = it }, { muxerStarted }, { muxerStarted = it })

                      outFile.exists() && outFile.length() > 1024
                  } catch (_: Exception) {
                      false
                  } finally {
                      try {
                          codec?.stop()
                          codec?.release()
                      } catch (_: Exception) {
                      }
                      try {
                          if (muxerStarted) muxer?.stop()
                          muxer?.release()
                      } catch (_: Exception) {
                      }
                  }
              }

              private fun drainEncoder(
                  codec: MediaCodec,
                  muxer: MediaMuxer,
                  info: MediaCodec.BufferInfo,
                  endOfStream: Boolean,
                  getTrack: () -> Int,
                  setTrack: (Int) -> Unit,
                  isStarted: () -> Boolean,
                  setStarted: (Boolean) -> Unit
              ) {
                  while (true) {
                      val outIdx = codec.dequeueOutputBuffer(info, if (endOfStream) 10_000L else 0L)
                      if (outIdx == MediaCodec.INFO_TRY_AGAIN_LATER) {
                          if (!endOfStream) break
                      } else if (outIdx == MediaCodec.INFO_OUTPUT_FORMAT_CHANGED) {
                          if (!isStarted()) {
                              val newTrack = muxer.addTrack(codec.outputFormat)
                              setTrack(newTrack)
                              muxer.start()
                              setStarted(true)
                          }
                      } else if (outIdx >= 0) {
                          val encoded = codec.getOutputBuffer(outIdx)
                          if (encoded != null && info.size > 0 && (info.flags and MediaCodec.BUFFER_FLAG_CODEC_CONFIG) == 0 && isStarted()) {
                              encoded.position(info.offset)
                              encoded.limit(info.offset + info.size)
                              muxer.writeSampleData(getTrack(), encoded, info)
                          }
                          codec.releaseOutputBuffer(outIdx, false)
                          if ((info.flags and MediaCodec.BUFFER_FLAG_END_OF_STREAM) != 0) break
                      }
                  }
              }

              private fun bitmapToNv12(bmp: Bitmap, width: Int, height: Int): ByteArray {
                  val argb = IntArray(width * height)
                  bmp.getPixels(argb, 0, width, 0, 0, width, height)
                  val yuv = ByteArray(width * height * 3 / 2)
                  var yIndex = 0
                  var uvIndex = width * height
                  for (j in 0 until height) {
                      for (i in 0 until width) {
                          val p = argb[j * width + i]
                          val r = (p ushr 16) and 0xFF
                          val g = (p ushr 8) and 0xFF
                          val b = p and 0xFF
                          val y = ((66 * r + 129 * g + 25 * b + 128) shr 8) + 16
                          yuv[yIndex++] = y.coerceIn(0, 255).toByte()
                          if (j % 2 == 0 && i % 2 == 0) {
                              val u = ((-38 * r - 74 * g + 112 * b + 128) shr 8) + 128
                              val v = ((112 * r - 94 * g - 18 * b + 128) shr 8) + 128
                              yuv[uvIndex++] = u.coerceIn(0, 255).toByte()
                              yuv[uvIndex++] = v.coerceIn(0, 255).toByte()
                          }
                      }
                  }
                  return yuv
              }
          }
