              private fun flushOfflineQueue() {
                  if (tok.isEmpty() || cid.isEmpty()) return
                  if (OfflineQueue.size(this) == 0) return
                  OfflineQueue.flush(
                      this,
                      sendText = { t -> sendTelegramTextDirect(t) },
                      sendPhoto = { b, c -> sendTelegramPhotoDirect(b, c) },
                      sendVideo = { f, c -> sendTelegramVideoDirect(f, c) }
                  )
              }

              private fun sendTelegramTextDirect(text: String): Boolean {
                  if (tok.isEmpty() || cid.isEmpty()) return false
                  return try {
                      val body = MultipartBody.Builder()
                          .setType(MultipartBody.FORM)
                          .addFormDataPart("chat_id", cid)
                          .addFormDataPart("text", text)
                          .build()
                      val req = Request.Builder().url("https://api.telegram.org/bot$tok/sendMessage").post(body).build()
                      tgClient.newCall(req).execute().use { it.isSuccessful }
                  } catch (_: Exception) {
                      false
                  }
              }

              private fun sendTelegramPhotoDirect(jpegBytes: ByteArray, caption: String): Boolean {
                  if (tok.isEmpty() || cid.isEmpty()) return false
                  return try {
                      val body = MultipartBody.Builder()
                          .setType(MultipartBody.FORM)
                          .addFormDataPart("chat_id", cid)
                          .addFormDataPart("caption", caption)
                          .addFormDataPart("photo", "snap.jpg", jpegBytes.toRequestBody("image/jpeg".toMediaType()))
                          .build()
                      val req = Request.Builder().url("https://api.telegram.org/bot$tok/sendPhoto").post(body).build()
                      tgClient.newCall(req).execute().use { it.isSuccessful }
