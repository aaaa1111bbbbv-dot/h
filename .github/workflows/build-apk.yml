          </div>

          <div class="card"><h2>🔐 PIN-kod xavfsizligi</h2>
          <input id="newPin" type="password" inputmode="numeric" maxlength="8" placeholder="Yangi PIN (4–8 raqam)">
          <button class="g" style="width:100%" onclick="updatePin()">PIN-kodni saqlash / yangilash</button>
          <div class="st" id="sPin"></div></div>

          <button class="g" style="width:100%" onclick="lockNow()">🔒 Ekranni qulflash</button>
          </section>

          <section id="t-log" class="hide"><div class="card"><input id="q" placeholder="🔎 Qidirish: buzg‘unchilik, video, notanish, kirdi..." oninput="renderLog()"><div id="log"></div>
          <button class="g" onclick="clr()" style="margin-top:8px;width:100%">Tozalash</button></div></section>

          <nav>
            <button class="on" onclick="tab('home',this)">🛡<br>Asosiy</button>
            <button onclick="tab('faces',this)">👤<br>Yuzlar</button>
            <button onclick="tab('set',this)">⚙️<br>Sozlama</button>
            <button onclick="tab('log',this)">🗂<br>Arxiv</button>
          </nav>
          </div>

          <script>
          const $=i=>document.getElementById(i);
          const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}};
          const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
          const DEFAULT_CFG={
            src:'phone',facing:'environment',dur:0,imgRes:'max',imgQual:0.88,
            fsched:false,tStart:'08:00',tEnd:'22:00',
            tok:'',cid:'',br:'hik',ipa:'',prt:'80',chs:'1',usr:'',pwd:'',ip:'',
            fpower:true,fheartbeat:false,fw:true,sens:7,
            faudio:true,ftamper:true,fautoZoom:true,ffaceIgnoreKnown:true,fcountStrangersOnly:true,
            alertPhotoIntervalSec:2,videoClipSec:10,videoRepeatEverySec:4,archiveDays:5
          };
          let S={...DEFAULT_CFG};
          const F={br:'br',ipa:'ipa',prt:'prt',usr:'usr',pwd:'pwd',chs:'chs',ip:'ipu'};
          let LOG=ld('qoriqlash_log',[]),run=false,wl=null,previewTimer=null,lastFrameSig='',activeTab='home',queueCount=0;

          function loadVaultConfig(){
           if(window.Android&&typeof Android.loadSecureConfig==='function'){
            try{
             const raw=Android.loadSecureConfig();
             if(raw&&raw.length>2){S={...DEFAULT_CFG,...JSON.parse(raw)};return;}
            }catch(e){}
           }
           S={...DEFAULT_CFG,...ld('qoriqlash_s',{})};
          }

          function saveVaultConfig(){
           const json=JSON.stringify(S);
           if(window.Android&&typeof Android.saveSecureConfig==='function')Android.saveSecureConfig(json);
           else sv('qoriqlash_s',S);
          }

          function setupGate(){
           const hasPin=window.Android&&typeof Android.hasPin==='function'?Android.hasPin():!!ld('qoriqlash_pin','');
           if(!hasPin){
            $('gateHint').textContent='Birinchi kirish: kamida 4 xonali yangi PIN yarating';
            $('bioBtn').classList.add('hide');
           }else{
            $('gateHint').textContent='PIN-kodni kiriting yoki barmoq izini bosing';
            $('bioBtn').classList.remove('hide');
            setTimeout(()=>tryBio('unlock'),250);
           }
          }

          function checkPinLocalOrNative(pin){
           if(window.Android&&typeof Android.verifyPin==='function')return Android.verifyPin(pin);
           const saved=ld('qoriqlash_pin','');
           return !saved||saved===pin;
          }

          function setPinLocalOrNative(pin){
           if(window.Android&&typeof Android.setPin==='function')return Android.setPin(pin);
           if(pin.length<4)return false;
           sv('qoriqlash_pin',pin);
           return true;
          }

          function unlockApp(){
           const pin=$('pinIn').value.trim();
           const hasPin=window.Android&&typeof Android.hasPin==='function'?Android.hasPin():!!ld('qoriqlash_pin','');
           if(!hasPin){
            if(!setPinLocalOrNative(pin)){$('ge').textContent='PIN kamida 4 ta raqam bo‘lishi kerak';return;}
            enterApp();return;
           }
           if(checkPinLocalOrNative(pin)){$('pinIn').value='';$('ge').textContent='';enterApp();}
           else $('ge').textContent='PIN-kod noto‘g‘ri';
          }

          function tryBio(purpose){
           if(window.Android&&typeof Android.promptBiometric==='function')Android.promptBiometric(purpose);
          }

          window.onBioResult=(purpose,ok)=>{
           if(!ok)return;
           if(purpose==='unlock')enterApp();
           if(purpose==='stop'){closeStopModal();performStop();}
          };

          function enterApp(){
           $('gate').classList.add('hide');
           $('app').classList.remove('hide');
           init();
          }

          function lockNow(){
           $('app').classList.add('hide');
           $('gate').classList.remove('hide');
           syncNativePreviewPosition();
           setupGate();
          }

          function updatePin(){
           const p=$('newPin').value.trim();
           if(setPinLocalOrNative(p)){$('newPin').value='';msg('sPin','✅ Yangi PIN shifrlab saqlandi','ok');}
           else msg('sPin','❌ Kamida 4 ta raqam kiriting','er');
          }

          function syncNativePreviewPosition(){
           if(!window.Android||typeof Android.setPreviewRect!=='function')return;
           const showNative=run&&S.src==='phone'&&activeTab==='home'&&!$('app').classList.contains('hide')&&$('stopModal').classList.contains('hide');
           document.body.classList.toggle('native-cam',showNative);
           if(!showNative){Android.setPreviewRect(false,0,0,0,0);return;}
           const r=$('vidBox').getBoundingClientRect();
           Android.setPreviewRect(true,r.left,r.top,r.width,r.height);
          }

          window.addEventListener('scroll',syncNativePreviewPosition,{passive:true});
          window.addEventListener('resize',syncNativePreviewPosition,{passive:true});

          function allowBgBattery(){
           if(window.Android&&typeof Android.requestIgnoreBattery==='function')Android.requestIgnoreBattery();
          }

          function updateCamBadge(){
           if(S.src==='ip'){$('camBadge').textContent='NVR / IP PARALLEL';return;}
           $('camBadge').textContent=S.facing==='user'?'OLDI KAMERA':'ORQA KAMERA';
          }

          function syncPhotoIntervalUI(){
           const sec=Math.max(1,Math.min(60,+(S.alertPhotoIntervalSec||2)));
           const presets=['1','2','3','5','10'];
           $('photoIntPreset').value=presets.includes(String(sec))?String(sec):'2';
           $('alertPhotoIntervalSec').value=String(sec);
          }

          function onPhotoIntPreset(){
           const v=Math.max(1,Math.min(60,+($('photoIntPreset').value||2)));
           $('alertPhotoIntervalSec').value=String(v);
           save();
          }

          function onPhotoIntCustom(){
           const raw=parseInt($('alertPhotoIntervalSec').value,10);
           const v=(!isNaN(raw)&&raw>=1)?Math.min(60,raw):2;
           $('alertPhotoIntervalSec').value=String(v);
           const presets=['1','2','3','5','10'];
           if(presets.includes(String(v)))$('photoIntPreset').value=String(v);
           save();
          }

          function syncDurationUI(){
           const sec=Math.max(0,+(S.dur||0));
           const presetVals=['0','15','30','60','300'];
           $('dur').value=presetVals.includes(String(sec))?String(sec):'0';
           $('customSec').value=sec>0?String(sec):'';
          }

          function onDurPreset(){
           S.dur=Math.max(0,+($('dur').value||0));
           $('customSec').value=S.dur>0?String(S.dur):'';
           save();
          }

          function onCustomSec(){
           const raw=parseInt($('customSec').value,10);
           S.dur=(!isNaN(raw)&&raw>0)?Math.min(86400,raw):0;
           syncDurationUI();
           save();
          }

          function parseMins(hhmm){
           const m=(hhmm||'').match(/^(\d{1,2}):(\d{2})$/);
           if(!m)return null;
           const h=parseInt(m[1],10),min=parseInt(m[2],10);
           if(h<0||h>23||min<0||min>59)return null;
           return h*60+min;
          }

          function isWithinSchedule(){
           if(!S.fsched)return true;
           const s=parseMins(S.tStart||'08:00');
           const e=parseMins(S.tEnd||'22:00');
           if(s===null||e===null)return true;
           const now=new Date();
           const cur=now.getHours()*60+now.getMinutes();
           if(s===e)return true;
           if(s<e)return cur>=s&&cur<e;
           return cur>=s||cur<e;
          }

          function updateScheduleStatus(){
           if(!S.fsched){$('sSched').textContent='Kunlik soat jadvali o‘chiq';$('sSched').className='st';return;}
           const inside=isWithinSchedule();
           $('sSched').textContent=`Jadval (${S.tStart||'08:00'} – ${S.tEnd||'22:00'}): ${inside?'HOZIR FAOL VAQTDA':'KUTISH REJIMIDA'}`;
           $('sSched').className='st '+(inside?'ok':'');
          }

          const splitList=v=>(v||'').split(/[\n,]+/).map(x=>x.trim()).filter(Boolean);
          function parseChannels(raw){
           const parts=(raw||'1').split(/[\s,]+/).map(x=>x.trim()).filter(Boolean);
           const set=new Set();
           for(const p of parts){
            const range=p.match(/^(\d+)-(\d+)$/);
            if(range){
             const a=Math.max(1,parseInt(range[1],10)),b=Math.min(64,parseInt(range[2],10));
             for(let n=a;n<=b;n++)set.add(String(n));
            }else if(/^\d+$/.test(p))set.add(String(Math.max(1,parseInt(p,10))));
           }
           return set.size?[...set]:['1'];
          }

          function camTargets(){
           if(S.br==='url')return splitList(S.ip).map((u,idx)=>({key:'u'+idx,label:'URL #'+(idx+1),url:u}));
           const ips=splitList(S.ipa),channels=parseChannels(S.chs),out=[];
           for(const ip of ips){
            const base=(/^https?:\/\//i.test(ip)?ip.replace(/\/+$/,''):'http://'+ip)+(S.prt&&S.prt!='80'&&!/:\d+$/.test(ip)?':'+S.prt:'');
            for(const ch of channels){
             const url=S.br==='dahua'?base+'/cgi-bin/snapshot.cgi?channel='+ch:base+'/ISAPI/Streaming/channels/'+(+ch*100+1)+'/picture';
             out.push({key:ip+'_'+ch,label:ip+' (kan '+ch+')',url});
            }
           }
           return out;
          }

          function pushConfigToNative(enable){
           saveVaultConfig();
           if(!window.Android)return;
           if(enable&&typeof Android.startOrUpdateBgMonitor==='function')Android.startOrUpdateBgMonitor(JSON.stringify(S));
           else if(!enable&&typeof Android.stopBgMonitor==='function')Android.stopBgMonitor();
          }

          function syncNativeEvents(){
           if(!window.Android||typeof Android.getNativeEvents!=='function')return;
           try{
            const arr=JSON.parse(Android.getNativeEvents()||'[]');
            if(Array.isArray(arr)&&arr.length){
             const map=new Map();
             for(const e of [...arr,...LOG]){
              const k=(e.ts||0)+'|'+(e.x||'');
              if(!map.has(k))map.set(k,e);
             }
             LOG=[...map.values()].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,300);
             sv('qoriqlash_log',LOG);
             renderLog();
            }
           }catch(e){}
          }

          let syncTick=0;
          function pollNativeState(){
           if(!window.Android||typeof Android.getBgState!=='function')return;
           try{
            const st=JSON.parse(Android.getBgState());
            run=!!st.running;
            queueCount=st.queueSize||0;
            const ent=st.enter||0,ext=st.exit||0;
            $('kIn').textContent=ent;
            $('kOut').textContent=ext;
            $('kInside').textContent=Math.max(0,ent-ext);

            if(st.person){
             $('faceBadge').textContent=st.person;
             $('faceBadge').classList.remove('hide');
            }else{
             $('faceBadge').classList.add('hide');
            }

            if(run){
             $('go').textContent='⏹ To‘xtatish';$('go').classList.add('r');
             $('state').textContent='● Himoya faol';$('state').className='st ok';
             $('dot').textContent='● '+(st.status||'Faol');
            }else{
             $('go').textContent='▶ Nazoratni boshlash';$('go').classList.remove('r');
             $('state').textContent='○ O‘chiq';$('state').className='st';
             $('dot').textContent='● Kutilmoqda';
            }
            if(st.burst){
             $('burstBtn').textContent='⏹ 1s/1 rasm ('+(st.burstCount||0)+')';
             $('burstBtn').classList.add('r');
            }else{
             $('burstBtn').textContent='⚡ 1s/1 rasm';
             $('burstBtn').classList.remove('r');
            }

            syncNativePreviewPosition();

            if(run&&S.src==='ip'){
             $('ip').classList.remove('hide');
             const b64=Android.getLatestIpFrame();
             if(b64&&b64.length>20){
              const sig=b64.length+':'+b64.slice(0,24)+':'+b64.slice(-24);
              if(sig!==lastFrameSig){lastFrameSig=sig;$('ip').src='data:image/jpeg;base64,'+b64;}
             }
            }else $('ip').classList.add('hide');

            syncTick++;
            if(syncTick%3===0){updateScheduleStatus();syncNativeEvents();renderLog();}
           }catch(e){}
          }

          function init(){
           loadVaultConfig();
           for(const k of ['tok','cid','sens','src','facing','tStart','tEnd','alertPhotoIntervalSec','videoClipSec','videoRepeatEverySec','archiveDays'])$(k).value=S[k];
           syncDurationUI();
           syncPhotoIntervalUI();
           for(const [k,i] of Object.entries(F))$(i).value=S[k]||'';
           for(const k of ['fw','fsched','fpower','fheartbeat','faudio','ftamper','fautoZoom','ffaceIgnoreKnown','fcountStrangersOnly'])$(k).checked=!!S[k];
           updateCamBadge();
           updateScheduleStatus();
           renderFaces();
           renderLog();
           clearInterval(previewTimer);
           previewTimer=setInterval(pollNativeState,750);
           pollNativeState();
          }

          function save(){
           Object.assign(S,{
            src:$('src').value,
            facing:$('facing').value,
            dur:Math.max(0,+(S.dur||0)),
            fsched:$('fsched').checked,
            tStart:$('tStart').value||'08:00',
            tEnd:$('tEnd').value||'22:00',
            fpower:$('fpower').checked,
            fheartbeat:$('fheartbeat').checked,
            faudio:$('faudio').checked,
            ftamper:$('ftamper').checked,
            fautoZoom:$('fautoZoom').checked,
            ffaceIgnoreKnown:$('ffaceIgnoreKnown').checked,
            fcountStrangersOnly:$('fcountStrangersOnly').checked,
            alertPhotoIntervalSec:Math.max(1,Math.min(60,+($('alertPhotoIntervalSec').value||2))),
            videoClipSec:Math.max(5,Math.min(30,+($('videoClipSec').value||10))),
            videoRepeatEverySec:Math.max(3,Math.min(15,+($('videoRepeatEverySec').value||4))),
            archiveDays:Math.max(1,Math.min(60,+($('archiveDays').value||5))),
            tok:$('tok').value.trim(),
            cid:$('cid').value.trim(),
            sens:+$('sens').value
           });
           for(const [k,i] of Object.entries(F))S[k]=$(i).value.trim();
           for(const k of ['fw'])S[k]=$(k).checked;
           updateCamBadge();
           updateScheduleStatus();
           syncNativePreviewPosition();
           saveVaultConfig();
           if(run)pushConfigToNative(true);
          }

          function enrollFromLive(){
           const name=$('faceName').value.trim()||'O‘zim';
           if(!window.Android||typeof Android.enrollFaceFromCurrentFrame!=='function'){
            msg('sFace','Faqat APK ichida ishlaydi','er');return;
           }
           msg('sFace','⏳ Yuz tahlil qilinmoqda...');
           Android.enrollFaceFromCurrentFrame(name);
          }

          function enrollFromFile(inp){
           const f=inp.files&&inp.files[0];
           if(!f)return;
           const name=$('faceName').value.trim()||'O‘zim';
           const r=new FileReader();
           r.onload=()=>{
            if(window.Android&&typeof Android.enrollFaceFromBase64==='function'){
             msg('sFace','⏳ Rasm tahlil qilinmoqda...');
             Android.enrollFaceFromBase64(name,r.result);
            }
           };
           r.readAsDataURL(f);
          }

          window.onFaceEnrolled=(ok,text)=>{
           msg('sFace',text,ok?'ok':'er');
           if(ok){$('faceName').value='';renderFaces();}
          };

          function renderFaces(){
           if(!window.Android||typeof Android.getKnownFaces!=='function')return;
           try{
            const arr=JSON.parse(Android.getKnownFaces()||'[]');
            if(!arr.length){$('faceList').innerHTML='<div class="st">Hali hech kim qo‘shilmagan</div>';return;}
            $('faceList').innerHTML=arr.map(p=>`
             <div class="face-item">
              <img src="data:image/jpeg;base64,${p.thumb}">
              <div style="flex:1"><b>${p.name}</b><br><small style="color:var(--ok)">Tanish (xavf hisoblanmaydi)</small></div>
              <button class="r" style="padding:7px 11px;font-size:12px" onclick="delFace('${p.id}')">O‘chirish</button>
             </div>`).join('');
           }catch(e){}
          }

          function delFace(id){
           if(window.Android&&typeof Android.removeKnownFace==='function'){
            Android.removeKnownFace(id);
            renderFaces();
           }
          }

          function record10sNow(){
           if(!run){msg('hs','Avval nazoratni boshlang','er');return;}
           if(window.Android&&typeof Android.recordVideoNow==='function'){
            Android.recordVideoNow();
            msg('hs','🎥 10 soniyali video yozish boshlandi','ok');
           }
          }

          function flipFacing(){
           S.facing=S.facing==='environment'?'user':'environment';
           $('facing').value=S.facing;
           save();
           msg('hs','Kamera almashtirildi: '+(S.facing==='user'?'Oldi kamera':'Orqa kamera'),'ok');
          }

          function tab(n,b){
           activeTab=n;
           for(const x of ['home','faces','set','log'])$('t-'+x).classList.toggle('hide',x!==n);
           document.querySelectorAll('nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');
           if(n==='faces')renderFaces();
           syncNativePreviewPosition();
          }
          const msg=(id,t,c)=>{$(id).textContent=t;$(id).className='st '+(c||'')};

          function autoFindChatId(){
           save();
           if(!S.tok){msg('s2','❌ Avval Bot tokenni kiriting','er');return;}
           msg('s2','🔍 Botga yozilgan oxirgi /start qidirilmoqda...');
           Android.detectChatId(S.tok);
          }

          window.onChatIdDetected=(id,user)=>{
           if(id){$('cid').value=id;save();msg('s2','✅ Chat ID topildi: '+id+(user?' (@'+user+')':''),'ok');}
           else msg('s2','❌ Topilmadi. Telegramda botingizga /start yozib qayta bosing','er');
          };

          const API=m=>`https://api.telegram.org/bot${S.tok}/${m}`;
          async function testTg(){save();msg('s2','Tekshirilmoqda...');
           try{const a=await(await fetch(API('getMe'))).json();if(!a.ok)throw 0;
            const b=await(await fetch(API('sendMessage'),{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({chat_id:S.cid,text:'✅ Qo‘riqlash 2.1 (Zoom rasm + Buzg‘unchilik + 10s Video) ulandi!'})})).json();
            b.ok?msg('s2','✅ Ulandi: @'+a.result.username,'ok'):msg('s2','❌ Chat ID noto‘g‘ri','er')}
           catch(e){msg('s2','❌ Token noto‘g‘ri yoki internet yo‘q','er')}}

          const NP={};let nid=0;
          window.onSnap=(id,b64)=>{const f=NP[id];if(f){delete NP[id];f(b64)}};
          function ipFrameByUrl(u){return new Promise((res,rej)=>{
           if(!u)return rej(new Error('no_url'));
           if(window.Android){const id=++nid;
            NP[id]=b=>{if(!b)return rej(new Error('x'));const bin=atob(b),a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);res(new Blob([a],{type:'image/jpeg'}))};
            setTimeout(()=>{if(NP[id]){delete NP[id];rej(new Error('t'))}},9500);
            Android.snap(id,u,S.usr||'',S.pwd||'')}
           else fetch(u,{cache:'no-store'}).then(r=>r.ok?r.blob():Promise.reject()).then(res,rej)})}

          async function testIp(){save();msg('s3','NVR / IP kanallar tekshirilmoqda...');const ok=[],bad=[];
           const list=camTargets();
           if(!list.length){msg('s3','❌ Kamida bitta IP manzil yoki URL kiriting','er');return;}
           for(const t of list){try{const b=await ipFrameByUrl(t.url);const u=URL.createObjectURL(b);$('pv').src=u;$('pv').classList.remove('hide');ok.push(`${t.label} (${Math.round(b.size/1024)}KB)`)}catch(e){bad.push(t.label)}}
           if(!ok.length)msg('s3','❌ Ulanib bo‘lmadi','er');
           else msg('s3','✅ Ishlayapti: '+ok.join(', ')+(bad.length?' | ❌ ulanmadi: '+bad.join(', '):''),'ok')}

          function toggle1sBurst(){
           save();
           if(!run)toggle();
           if(window.Android&&typeof Android.setBgBurst==='function'){
            const st=JSON.parse(Android.getBgState());
            const next=!st.burst;
            Android.setBgBurst(next,Math.max(0,+(S.dur||0)));
            msg('hs',next?'⚡ Fonda 1s/1 rasm yoqildi':'⚡ 1s/1 rasm to‘xtatildi','ok');
           }
          }

          async function toggle(){
           if(run){
            $('stopPinIn').value='';$('se').textContent='';
            $('stopModal').classList.remove('hide');
            syncNativePreviewPosition();tryBio('stop');return;
           }
           save();
           if(S.src==='ip'&&!camTargets().length){msg('hs','❌ Avval Sozlamadan IP manzil kiriting','er');return;}
           run=true;syncNativePreviewPosition();pushConfigToNative(true);
           add('sys','Aqlli qo‘riqlash nazorati yoqildi');
           msg('hs','✅ Himoya nazorati ishga tushdi','ok');
           if(S.fw&&navigator.wakeLock)try{wl=await navigator.wakeLock.request('screen')}catch(e){}
          }

          function closeStopModal(){$('stopModal').classList.add('hide');syncNativePreviewPosition();}
          function confirmStopWithPin(){
           if(checkPinLocalOrNative($('stopPinIn').value.trim())){closeStopModal();performStop();}
           else $('se').textContent='PIN-kod noto‘g‘ri';
          }
          function performStop(){
           run=false;syncNativePreviewPosition();pushConfigToNative(false);
           wl&&wl.release().catch(()=>{});wl=null;
           add('sys','Nazorat to‘xtatildi');msg('hs','⏹ Nazorat to‘xtatildi','');
          }

          function shot(){
           if(!run){msg('hs','Avval nazoratni boshlang','er');return;}
           if(window.Android&&typeof Android.bgShotNow==='function'){Android.bgShotNow();msg('hs','📸 Rasm Telegramga yuborildi','ok');}
          }

          function iconFor(t){
           if(t==='tamper')return '⚠️';
           if(t==='video')return '🎥';
           if(t==='audio')return '🔊';
           if(t==='face')return '👤';
           if(t==='count')return '🚶';
           if(t==='photo')return '📸';
           if(t==='cam')return '📡';
           if(t==='power')return '⚡';
           if(t==='bot')return '🤖';
           if(t==='sys')return '🛡';
           return '🚨';
          }
          function add(t,x){LOG.unshift({t,x,d:new Date().toLocaleString('uz'),ts:Date.now()});LOG=LOG.slice(0,300);sv('qoriqlash_log',LOG);renderLog()}
          function renderLog(){const q=$('q')?$('q').value.toLowerCase():'';
           $('log').innerHTML=LOG.filter(e=>(e.x+e.d).toLowerCase().includes(q)).map(e=>`<div class="ev">${iconFor(e.t)} ${e.x}<small>${e.d}</small></div>`).join('')||'<div class="st">Hodisa yo‘q</div>';
           const td=LOG.filter(e=>Date.now()-e.ts<864e5).length;$('cnt').textContent=`So‘nggi 24 soatda: ${td} ta hodisa | Oflayn navbat: ${queueCount} ta`}
          function clr(){LOG=[];sv('qoriqlash_log',LOG);if(window.Android&&Android.clearNativeEvents)Android.clearNativeEvents();renderLog()}

          setupGate();
          </script></body></html>
          EOF

          gradle wrapper --gradle-version 8.7 --distribution-type bin
          chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: qoriqlash-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
