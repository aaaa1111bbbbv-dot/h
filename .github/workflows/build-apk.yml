name: Build Qoriqlash APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK & Gradle
        run: |
          set -e
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "$SDK_ROOT"
          echo "sdk.dir=$SDK_ROOT" > local.properties

          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name "sdkmanager" 2>/dev/null | head -n 1 || true)
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-34" "build-tools;34.0.0" "platform-tools" || true
          fi

          if ! command -v gradle >/dev/null 2>&1; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.7-bin.zip -o /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt/gradle
            export PATH="/opt/gradle/gradle-8.7/bin:$PATH"
            echo "/opt/gradle/gradle-8.7/bin" >> "$GITHUB_PATH"
          fi

      - name: Create project files
        run: |
          set -e
          mkdir -p .github/workflows app/src/main/assets app/src/main/java/uz/qoriqlash/app app/src/main/res/values

          cat <<'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Qoriqlash"
          include(":app")
          EOF

          cat <<'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat <<'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF

          cat <<'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "uz.qoriqlash.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "uz.qoriqlash.app"
                  minSdk = 24
                  targetSdk = 34
                  versionCode = 4
                  versionName = "2.1-zoom-tamper"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-ktx:1.9.2")
              implementation("androidx.fragment:fragment-ktx:1.8.2")
              implementation("androidx.lifecycle:lifecycle-service:2.8.4")
              implementation("androidx.camera:camera-core:1.3.4")
              implementation("androidx.camera:camera-camera2:1.3.4")
              implementation("androidx.camera:camera-lifecycle:1.3.4")
              implementation("androidx.camera:camera-view:1.3.4")
              implementation("androidx.camera:camera-video:1.3.4")
              implementation("androidx.security:security-crypto:1.1.0-alpha06")
              implementation("androidx.biometric:biometric:1.1.0")
              implementation("com.google.mlkit:face-detection:16.1.7")
              implementation("com.google.mlkit:object-detection:17.0.2")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
          }
          EOF

          cat <<'EOF' > app/proguard-rules.pro
          -keep class uz.qoriqlash.app.MainActivity$CameraBridge {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keep class uz.qoriqlash.app.MonitorForegroundService { *; }
          EOF

          cat <<'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">Qo‘riqlash</string>
          </resources>
          EOF

          cat <<'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_CAMERA" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS" />
              <uses-permission android:name="android.permission.USE_BIOMETRIC" />

              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-feature android:name="android.hardware.microphone" android:required="false" />

              <application
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:hardwareAccelerated="true"
                  android:label="Qo‘riqlash"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Material.NoActionBar">

                  <service
                      android:name=".MonitorForegroundService"
                      android:enabled="true"
                      android:exported="false"
                      android:stopWithTask="false"
                      android:foregroundServiceType="dataSync|camera|microphone" />

                  <receiver
                      android:name=".BootReceiver"
                      android:enabled="true"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                      </intent-filter>
                  </receiver>

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat <<'EOF' > app/src/main/java/uz/qoriqlash/app/SecureStore.kt
          package uz.qoriqlash.app

          import android.content.Context
          import android.content.SharedPreferences
          import androidx.security.crypto.EncryptedSharedPreferences
          import androidx.security.crypto.MasterKey
          import org.json.JSONArray
          import org.json.JSONObject

          object SecureStore {
              private const val PREF_NAME = "qoriqlash_vault_v2"

              private fun prefs(ctx: Context): SharedPreferences {
                  return try {
                      val masterKey = MasterKey.Builder(ctx.applicationContext)
                          .setKeyScheme(MasterKey.KeyScheme.AES256_GCM)
                          .build()
                      EncryptedSharedPreferences.create(
                          ctx.applicationContext,
                          PREF_NAME,
                          masterKey,
                          EncryptedSharedPreferences.PrefKeyEncryptionScheme.AES256_SIV,
                          EncryptedSharedPreferences.PrefValueEncryptionScheme.AES256_GCM
                      )
                  } catch (_: Exception) {
                      ctx.applicationContext.getSharedPreferences(PREF_NAME + "_fb", Context.MODE_PRIVATE)
                  }
              }

              fun saveConfigJson(ctx: Context, json: String) {
                  prefs(ctx).edit().putString("cfg_json", json).apply()
              }

              fun loadConfigJson(ctx: Context): String {
                  return prefs(ctx).getString("cfg_json", "") ?: ""
              }

              fun loadConfig(ctx: Context): JSONObject {
                  val raw = loadConfigJson(ctx)
                  return try {
                      if (raw.isNotEmpty()) JSONObject(raw) else JSONObject()
                  } catch (_: Exception) {
                      JSONObject()
                  }
              }

              fun setWasRunning(ctx: Context, running: Boolean) {
                  prefs(ctx).edit().putBoolean("was_running", running).apply()
              }

              fun wasRunning(ctx: Context): Boolean {
                  return prefs(ctx).getBoolean("was_running", false)
              }

              fun setPin(ctx: Context, pin: String) {
                  prefs(ctx).edit().putString("app_pin", pin.trim()).apply()
              }

              fun getPin(ctx: Context): String {
                  return prefs(ctx).getString("app_pin", "") ?: ""
              }

              fun hasPin(ctx: Context): Boolean = getPin(ctx).length >= 4

              fun checkPin(ctx: Context, input: String): Boolean {
                  val saved = getPin(ctx)
                  if (saved.isEmpty()) return true
                  return saved == input.trim()
              }

              fun setLastUpdateId(ctx: Context, id: Long) {
                  prefs(ctx).edit().putLong("tg_offset", id).apply()
              }

              fun getLastUpdateId(ctx: Context): Long {
                  return prefs(ctx).getLong("tg_offset", 0L)
              }

              fun saveKnownFacesJson(ctx: Context, json: String) {
                  prefs(ctx).edit().putString("known_faces", json).apply()
              }

              fun getKnownFacesArray(ctx: Context): JSONArray {
                  return try {
                      val raw = prefs(ctx).getString("known_faces", "[]") ?: "[]"
                      JSONArray(raw)
                  } catch (_: Exception) {
                      JSONArray()
                  }
              }

              fun saveCounts(ctx: Context, dayKey: String, enter: Int, exit: Int) {
                  prefs(ctx).edit()
                      .putString("cnt_day", dayKey)
                      .putInt("cnt_in", enter)
                      .putInt("cnt_out", exit)
                      .apply()
              }

              fun loadCounts(ctx: Context, dayKey: String): Pair<Int, Int> {
                  val p = prefs(ctx)
                  val savedDay = p.getString("cnt_day", "") ?: ""
                  if (savedDay != dayKey) return 0 to 0
                  return p.getInt("cnt_in", 0) to p.getInt("cnt_out", 0)
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/uz/qoriqlash/app/FaceProfileManager.kt
          package uz.qoriqlash.app

          import android.content.Context
          import android.graphics.Bitmap
          import android.graphics.BitmapFactory
          import android.graphics.PointF
          import android.graphics.Rect
          import android.util.Base64
          import com.google.android.gms.tasks.Tasks
          import com.google.mlkit.vision.common.InputImage
          import com.google.mlkit.vision.face.Face
          import com.google.mlkit.vision.face.FaceDetection
          import com.google.mlkit.vision.face.FaceDetectorOptions
          import com.google.mlkit.vision.face.FaceLandmark
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.ByteArrayOutputStream
          import java.util.concurrent.TimeUnit
          import kotlin.math.hypot
          import kotlin.math.sqrt

          object FaceProfileManager {

              private val detector by lazy {
                  val opts = FaceDetectorOptions.Builder()
                      .setPerformanceMode(FaceDetectorOptions.PERFORMANCE_MODE_ACCURATE)
                      .setLandmarkMode(FaceDetectorOptions.LANDMARK_MODE_ALL)
                      .setClassificationMode(FaceDetectorOptions.CLASSIFICATION_MODE_NONE)
                      .setMinFaceSize(0.10f)
                      .enableTracking()
                      .build()
                  FaceDetection.getClient(opts)
              }

              fun detectFacesSync(bitmap: Bitmap): List<Face> {
                  return try {
                      val image = InputImage.fromBitmap(bitmap, 0)
                      Tasks.await(detector.process(image), 2500, TimeUnit.MILLISECONDS)
                  } catch (_: Exception) {
                      emptyList()
                  }
              }

              fun cropAndZoomJpeg(src: Bitmap, targetBox: Rect, quality: Int = 90): ByteArray? {
                  return try {
                      val bw = src.width
                      val bh = src.height
                      if (bw < 32 || bh < 32) return null

                      // Yuz/obyekt atrofini 65% kengaytirib kesish (yuz + elka aniq ko'rinishi uchun)
                      val padX = (targetBox.width() * 0.65f).toInt().coerceAtLeast(bw / 10)
                      val padY = (targetBox.height() * 0.75f).toInt().coerceAtLeast(bh / 10)

                      val l = (targetBox.left - padX).coerceIn(0, bw - 2)
                      val t = (targetBox.top - padY).coerceIn(0, bh - 2)
                      val r = (targetBox.right + padX).coerceIn(l + 2, bw)
                      val b = (targetBox.bottom + padY).coerceIn(t + 2, bh)

                      val cw = (r - l).coerceAtLeast(16)
                      val ch = (b - t).coerceAtLeast(16)
                      val cropped = Bitmap.createBitmap(src, l, t, cw, ch)

                      // Agar kesilgan rasm kichik bo'lsa, ko'rishga qulay o'lchamga kattalashtiramiz
                      val outBmp = if (cw < 640) {
                          val scale = (640f / cw.toFloat()).coerceAtMost(2.5f)
                          val nw = (cw * scale).toInt()
                          val nh = (ch * scale).toInt()
                          Bitmap.createScaledBitmap(cropped, nw, nh, true).also {
                              if (it !== cropped) cropped.recycle()
                          }
                      } else {
                          cropped
                      }

                      val baos = ByteArrayOutputStream()
                      outBmp.compress(Bitmap.CompressFormat.JPEG, quality.coerceIn(60, 95), baos)
                      outBmp.recycle()
                      baos.toByteArray()
                  } catch (_: Exception) {
                      null
                  }
              }

              fun extractSignature(face: Face, bmp: Bitmap): FloatArray? {
                  val box = face.boundingBox
                  val w = box.width().toFloat().coerceAtLeast(1f)
                  val h = box.height().toFloat().coerceAtLeast(1f)

                  val le = face.getLandmark(FaceLandmark.LEFT_EYE)?.position
                  val re = face.getLandmark(FaceLandmark.RIGHT_EYE)?.position
                  val nose = face.getLandmark(FaceLandmark.NOSE_BASE)?.position
                  val ml = face.getLandmark(FaceLandmark.MOUTH_LEFT)?.position
                  val mr = face.getLandmark(FaceLandmark.MOUTH_RIGHT)?.position
                  val mb = face.getLandmark(FaceLandmark.MOUTH_BOTTOM)?.position
                  val lc = face.getLandmark(FaceLandmark.LEFT_CHEEK)?.position
                  val rc = face.getLandmark(FaceLandmark.RIGHT_CHEEK)?.position

                  val pts = listOf(le, re, nose, ml, mr, mb, lc, rc)
                  if (pts.count { it != null } < 4) return null

                  fun normDist(a: PointF?, b: PointF?): Float {
                      if (a == null || b == null) return 0f
                      return hypot(a.x - b.x, a.y - b.y) / w
                  }

                  val eyeDist = normDist(le, re).coerceAtLeast(0.05f)
                  val geom = floatArrayOf(
                      w / h,
                      eyeDist,
                      normDist(le, nose) / eyeDist,
                      normDist(re, nose) / eyeDist,
                      normDist(nose, mb) / eyeDist,
                      normDist(ml, mr) / eyeDist,
                      normDist(le, ml) / eyeDist,
                      normDist(re, mr) / eyeDist,
                      normDist(lc, rc) / eyeDist,
                      normDist(lc, nose) / eyeDist,
                      normDist(rc, nose) / eyeDist,
                      normDist(ml, mb) / eyeDist,
                      normDist(mr, mb) / eyeDist,
                      ((nose?.y ?: box.centerY().toFloat()) - box.top) / h,
                      ((mb?.y ?: box.bottom.toFloat()) - box.top) / h,
                      ((le?.y ?: box.top.toFloat()) - box.top) / h
                  )

                  val patch = extractNormalizedFacePatch(bmp, box)
                  return geom + patch
              }

              private fun extractNormalizedFacePatch(bmp: Bitmap, rawBox: Rect): FloatArray {
                  val out = FloatArray(64)
                  val left = rawBox.left.coerceIn(0, (bmp.width - 2).coerceAtLeast(0))
                  val top = rawBox.top.coerceIn(0, (bmp.height - 2).coerceAtLeast(0))
                  val right = rawBox.right.coerceIn(left + 1, bmp.width)
                  val bottom = rawBox.bottom.coerceIn(top + 1, bmp.height)
                  val crop = Bitmap.createBitmap(bmp, left, top, right - left, bottom - top)
                  val small = Bitmap.createScaledBitmap(crop, 8, 8, true)
                  if (crop !== bmp) crop.recycle()

                  var mean = 0f
                  val vals = FloatArray(64)
                  for (y in 0 until 8) {
                      for (x in 0 until 8) {
                          val p = small.getPixel(x, y)
                          val r = (p ushr 16) and 0xFF
                          val g = (p ushr 8) and 0xFF
                          val b = p and 0xFF
                          val lum = (r * 0.3f + g * 0.59f + b * 0.11f)
                          val idx = y * 8 + x
                          vals[idx] = lum
                          mean += lum
                      }
                  }
                  small.recycle()
                  mean /= 64f
                  var variance = 0f
                  for (i in 0 until 64) {
                      val d = vals[i] - mean
                      variance += d * d
                  }
                  val std = sqrt((variance / 64f).coerceAtLeast(1f))
                  for (i in 0 until 64) {
                      out[i] = ((vals[i] - mean) / std) * 0.15f
                  }
                  return out
              }

              fun enrollFromJpeg(ctx: Context, name: String, jpegBytes: ByteArray): Pair<Boolean, String> {
                  val cleanName = name.trim().ifEmpty { "O‘zim" }
                  val bmp = BitmapFactory.decodeByteArray(jpegBytes, 0, jpegBytes.size)
                      ?: return false to "Rasm ochilmadi"
                  val faces = detectFacesSync(bmp)
                  if (faces.isEmpty()) {
                      bmp.recycle()
                      return false to "Rasmda yuz topilmadi. Yuzingizni yorug‘ joyda kameraga qaratib qayta oling."
                  }
                  val mainFace = faces.maxByOrNull { it.boundingBox.width() * it.boundingBox.height() }!!
                  val sig = extractSignature(mainFace, bmp)
                  if (sig == null) {
                      bmp.recycle()
                      return false to "Yuz nuqtalari to‘liq ko‘rinmadi. Yaqinroq va to‘g‘ri qarab oling."
                  }

                  val box = mainFace.boundingBox
                  val l = (box.left - box.width() / 5).coerceAtLeast(0)
                  val t = (box.top - box.height() / 5).coerceAtLeast(0)
                  val r = (box.right + box.width() / 5).coerceAtMost(bmp.width)
                  val b = (box.bottom + box.height() / 5).coerceAtMost(bmp.height)
                  val thumbBmp = Bitmap.createBitmap(bmp, l, t, (r - l).coerceAtLeast(1), (b - t).coerceAtLeast(1))
                  val scaledThumb = Bitmap.createScaledBitmap(thumbBmp, 96, 96, true)
                  if (thumbBmp !== bmp) thumbBmp.recycle()
                  bmp.recycle()

                  val baos = ByteArrayOutputStream()
                  scaledThumb.compress(Bitmap.CompressFormat.JPEG, 75, baos)
                  scaledThumb.recycle()
                  val thumbB64 = Base64.encodeToString(baos.toByteArray(), Base64.NO_WRAP)

                  val arr = SecureStore.getKnownFacesArray(ctx)
                  val vecArr = JSONArray()
                  for (v in sig) vecArr.put(v.toDouble())

                  val item = JSONObject().apply {
                      put("id", System.currentTimeMillis().toString())
                      put("name", cleanName)
                      put("vec", vecArr)
                      put("thumb", thumbB64)
                  }
                  arr.put(item)
                  SecureStore.saveKnownFacesJson(ctx, arr.toString())
                  return true to "✅ \"$cleanName\" tanishlar ro‘yxatiga qo‘shildi"
              }

              fun listProfilesSummary(ctx: Context): String {
                  val arr = SecureStore.getKnownFacesArray(ctx)
                  val out = JSONArray()
                  for (i in 0 until arr.length()) {
                      val o = arr.optJSONObject(i) ?: continue
                      out.put(JSONObject().apply {
                          put("id", o.optString("id"))
                          put("name", o.optString("name"))
                          put("thumb", o.optString("thumb"))
                      })
                  }
                  return out.toString()
              }

              fun removeProfile(ctx: Context, id: String) {
                  val arr = SecureStore.getKnownFacesArray(ctx)
                  val next = JSONArray()
                  for (i in 0 until arr.length()) {
                      val o = arr.optJSONObject(i) ?: continue
                      if (o.optString("id") != id) next.put(o)
                  }
                  SecureStore.saveKnownFacesJson(ctx, next.toString())
              }

              fun matchFace(ctx: Context, face: Face, bmp: Bitmap, strictness: Int): String? {
                  val arr = SecureStore.getKnownFacesArray(ctx)
                  if (arr.length() == 0) return null
                  val sig = extractSignature(face, bmp) ?: return null

                  var bestName: String? = null
                  var bestDist = Float.MAX_VALUE
                  val maxAllowedDist = (0.34f - (strictness - 5) * 0.015f).coerceIn(0.20f, 0.44f)

                  for (i in 0 until arr.length()) {
                      val o = arr.optJSONObject(i) ?: continue
                      val vec = o.optJSONArray("vec") ?: continue
                      if (vec.length() != sig.size) continue
                      var sumSq = 0f
                      for (j in sig.indices) {
                          val weight = if (j < 16) 1.4f else 0.7f
                          val d = (sig[j] - vec.optDouble(j, 0.0).toFloat()) * weight
                          sumSq += d * d
                      }
                      val dist = sqrt(sumSq / sig.size)
                      if (dist < bestDist) {
                          bestDist = dist
                          bestName = o.optString("name", "Tanish")
                      }
                  }
                  return if (bestDist <= maxAllowedDist) bestName else null
              }
          }
          EOF

          cat <<'EOF' > app/src/main/java/uz/qoriqlash/app/DangerAudioDetector.kt
          package uz.qoriqlash.app

          import android.Manifest
          import android.content.Context
          import android.content.pm.PackageManager
          import android.media.AudioFormat
          import android.media.AudioRecord
          import android.media.MediaRecorder
          import androidx.core.content.ContextCompat
          import java.util.concurrent.atomic.AtomicBoolean
          import kotlin.math.abs
          import kotlin.math.sqrt

          class DangerAudioDetector(
              private val context: Context,
              private val onDangerSound: (label: String, level: Int) -> Unit
          ) {
              private val running = AtomicBoolean(false)
              private var thread: Thread? = null
              @Volatile var sensitivity: Int = 7
              @Volatile var enabled: Boolean = true

              fun start() {
                  if (running.get()) return
                  if (ContextCompat.checkSelfPermission(context, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                      return
                  }
                  running.set(true)
                  thread = Thread {
                      val sampleRate = 16000
                      val minBuf = AudioRecord.getMinBufferSize(
                          sampleRate,
                          AudioFormat.CHANNEL_IN_MONO,
                          AudioFormat.ENCODING_PCM_16BIT
                      ).coerceAtLeast(2048)

                      var recorder: AudioRecord? = null
                      try {
                          recorder = AudioRecord(
                              MediaRecorder.AudioSource.MIC,
                              sampleRate,
                              AudioFormat.CHANNEL_IN_MONO,
                              AudioFormat.ENCODING_PCM_16BIT,
                              minBuf * 2
                          )
                          if (recorder.state != AudioRecord.STATE_INITIALIZED) {
                              running.set(false)
                              return@Thread
                          }
                          recorder.startRecording()
                          val buf = ShortArray(1600)
                          var prevRms = 200.0
                          var screamStreak = 0
                          var lastTriggerMs = 0L

                          while (running.get()) {
                              if (!enabled) {
                                  Thread.sleep(150)
                                  continue
                              }
                              val read = recorder.read(buf, 0, buf.size)
                              if (read <= 0) continue

                              var sumSq = 0.0
                              var zeroCrossings = 0
                              var peak = 0
                              var highFreqEnergy = 0.0

                              for (i in 0 until read) {
                                  val v = buf[i].toInt()
                                  val av = abs(v)
                                  if (av > peak) peak = av
                                  sumSq += v.toDouble() * v.toDouble()
                                  if (i > 0) {
                                      val prev = buf[i - 1].toInt()
                                      if ((v >= 0 && prev < 0) || (v < 0 && prev >= 0)) {
                                          zeroCrossings++
                                      }
                                      val diff = abs(v - prev)
                                      highFreqEnergy += diff.toDouble() * diff.toDouble()
                                  }
                              }

                              val rms = sqrt(sumSq / read)
                              val highRatio = sqrt(highFreqEnergy / read) / (rms + 1.0)
                              val zcrRate = zeroCrossings.toDouble() / (read.toDouble() / sampleRate)

                              val sensScale = (11 - sensitivity.coerceIn(1, 10)) * 0.14 + 0.55
                              val glassRmsThresh = 2600.0 * sensScale
                              val screamRmsThresh = 2200.0 * sensScale
                              val bangRmsThresh = 4800.0 * sensScale

                              val suddenSpike = rms > prevRms * 3.1 && rms > glassRmsThresh
                              prevRms = prevRms * 0.85 + rms * 0.15

                              val now = System.currentTimeMillis()
                              var detectedLabel: String? = null

                              if (suddenSpike && highRatio > 0.72 && zcrRate > 2400.0) {
                                  detectedLabel = "💥 Shisha sinishi / keskin jarang"
                                  screamStreak = 0
                              } else if (rms > screamRmsThresh && zcrRate in 900.0..3400.0 && highRatio in 0.25..0.85) {
                                  screamStreak++
                                  if (screamStreak >= 3) {
                                      detectedLabel = "😱 Qichqiriq / baland baqiriq"
                                      screamStreak = 0
                                  }
                              } else if (suddenSpike && peak > 24000 && rms > bangRmsThresh) {
                                  detectedLabel = "🔊 Kuchli zarba / xavfli shovqin"
                                  screamStreak = 0
                              } else {
                                  if (screamStreak > 0) screamStreak--
                              }

                              if (detectedLabel != null && now - lastTriggerMs > 2000L) {
                                  lastTriggerMs = now
                                  onDangerSound(detectedLabel, rms.toInt())
                              }
                          }
                      } catch (_: Exception) {
                      } finally {
                          try {
                              recorder?.stop()
                              recorder?.release()
                          } catch (_: Exception) {
                          }
                          running.set(false)
                      }
                  }.apply { start() }
              }

              fun stop() {
                  running.set(false)
                  try {
                      thread?.interrupt()
                  } catch (_: Exception) {
                  }
                  thread = null
              }
          }
