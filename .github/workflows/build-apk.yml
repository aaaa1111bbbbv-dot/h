                          }
                          val escMsg = res.second.replace("\\", "\\\\").replace("'", "\\'")
                          activity.runOnUiThread {
                              webView.evaluateJavascript("window.onFaceEnrolled(${res.first}, '$escMsg');", null)
                          }
                      }.start()
                  }

                  @JavascriptInterface
                  fun enrollFaceFromBase64(personName: String, b64: String) {
                      Thread {
                          val res = try {
                              val clean = b64.substringAfter(",")
                              val bytes = Base64.decode(clean, Base64.DEFAULT)
                              FaceProfileManager.enrollFromJpeg(activity, personName, bytes)
                          } catch (_: Exception) {
                              false to "Rasmni o‘qib bo‘lmadi"
                          }
                          val escMsg = res.second.replace("\\", "\\\\").replace("'", "\\'")
                          activity.runOnUiThread {
