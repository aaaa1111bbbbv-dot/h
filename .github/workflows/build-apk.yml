              private fun processPhoneFrame(image: ImageProxy) {
                  try {
                      val now = System.currentTimeMillis()
                      if (!active || manualStopped || !isScheduleOpen()) return
                      if (now - lastAnalyzeMs < 240L) return
                      lastAnalyzeMs = now

                      val yPlane = image.planes[0]
                      val yBuf = yPlane.buffer
                      val w = image.width
                      val h = image.height
                      val rowStride = yPlane.rowStride

                      val step = 12
                      val sw = (w / step).coerceAtLeast(1)
                      val sh = (h / step).coerceAtLeast(1)
                      val sample = ByteArray(sw * sh)
                      var k = 0
                      var sumLum = 0L
                      var minLum = 255
                      var maxLum = 0
                      var y = 0
                      while (y < h && k < sample.size) {
                          var x = 0
                          val rowOffset = y * rowStride
                          while (x < w && k < sample.size) {
                              val idxBuf = rowOffset + x
                              if (idxBuf < yBuf.limit()) {
                                  val v = yBuf.get(idxBuf).toInt() and 0xFF
                                  sample[k++] = v.toByte()
                                  sumLum += v
                                  if (v < minLum) minLum = v
                                  if (v > maxLum) maxLum = v
                              }
                              x += step
                          }
                          y += step
                      }

                      val avgLum = if (k > 0) sumLum.toFloat() / k else 128f
                      val contrast = maxLum - minLum

                      val key = "phone_$facing"
                      val prev = lastGray[key]
                      lastGray[key] = sample

                      var motionDetected = false
                      var tamperDetected = false
                      var motionMinX = sw
                      var motionMinY = sh
                      var motionMaxX = 0
                      var motionMaxY = 0

                      if (prev != null && prev.size == sample.size) {
                          var diff = 0
                          for (i in sample.indices) {
                              if (abs((sample[i].toInt() and 0xFF) - (prev[i].toInt() and 0xFF)) > 22) {
                                  diff++
                                  val gx = i % sw
                                  val gy = i / sw
                                  if (gx < motionMinX) motionMinX = gx
                                  if (gx > motionMaxX) motionMaxX = gx
                                  if (gy < motionMinY) motionMinY = gy
                                  if (gy > motionMaxY) motionMaxY = gy
                              }
                          }
                          val ratio = (diff * 100.0) / sample.size.coerceAtLeast(1)
                          val threshold = (11 - sens) * 1.15
                          if (ratio > threshold) motionDetected = true

                          // Buzg'unchilik: kamerani to'sib qo'yish (kadrning 85%+ o'zgarishi va bir xil qorong'u/yorug' rang)
                          if (ftamper && ratio > 85.0 && contrast < 26 && (avgLum < 16f || avgLum > 242f)) {
                              tamperDetected = true
                          }
                      }

                      val needBurst = burstActive && (now - lastBurstSentMs >= 950L)
                      val needShot = pendingShotNow.compareAndSet(true, false)

                      if (motionDetected || tamperDetected || needBurst || needShot) {
                          val fullJpeg = imageProxyToJpeg(image, imgQual) ?: return
                          latestFullJpeg.set(fullJpeg)

                          if (needShot) {
                              pushEvent("photo", "Rasm olindi (${fullJpeg.size / 1024} KB)")
                              sendOrQueuePhoto(fullJpeg, "📸 Telefon kamerasi (${fullJpeg.size / 1024}KB)")
                          }
                          if (needBurst) {
                              if (burstEndMs > 0L && now >= burstEndMs) {
                                  handler.post { stopBurstInternal() }
                              } else {
                                  lastBurstSentMs = now
                                  sendBurstFrame(fullJpeg)
                              }
                          }

                          if (tamperDetected && now - lastTamperMs > 2500L) {
                              lastTamperMs = now
                              val tMsg = "⚠️ BUZG‘UNCHILIK: Kamera obyektivi to‘sildi yoki yopildi!"
                              pushEvent("tamper", tMsg)
                              triggerDangerEpisode(tMsg, null, fullJpeg)
                              return
                          }

                          if (motionDetected) {
                              val normBox = if (motionMaxX > motionMinX && motionMaxY > motionMinY) {
                                  floatArrayOf(
                                      motionMinX.toFloat() / sw,
                                      motionMinY.toFloat() / sh,
                                      motionMaxX.toFloat() / sw,
                                      motionMaxY.toFloat() / sh
                                  )
                              } else null
                              analyzeBitmapForFacesAndCounting(fullJpeg, now, null, normBox)
                          }
                      }
                  } catch (_: Exception) {
                  } finally {
                      image.close()
                  }
              }

              private fun analyzeBitmapForFacesAndCounting(
                  jpegBytes: ByteArray,
                  now: Long,
                  channelKey: String?,
                  motionNormBox: FloatArray?
              ) {
                  val bmp = BitmapFactory.decodeByteArray(jpegBytes, 0, jpegBytes.size) ?: return
                  try {
                      val faces = FaceProfileManager.detectFacesSync(bmp)
                      var knownPersonName: String? = null
                      var strangerFaceBox: Rect? = null

                      for (face in faces) {
                          val matched = FaceProfileManager.matchFace(this, face, bmp, sens)
                          if (matched != null) {
                              knownPersonName = matched
                          } else {
                              if (strangerFaceBox == null ||
                                  face.boundingBox.width() * face.boundingBox.height() > strangerFaceBox.width() * strangerFaceBox.height()
                              ) {
                                  strangerFaceBox = face.boundingBox
                              }
                          }
                      }

                      val hasStrangerFace = strangerFaceBox != null
                      val personBox = updateLineCrossingCounts(bmp, faces.isNotEmpty(), knownPersonName != null)

                      // Tanish yuz bo'lsa va begona bo'lmasa -> XAVF EMAS!
                      if (ffaceIgnoreKnown && knownPersonName != null && !hasStrangerFace) {
                          lastRecognizedPerson = knownPersonName
                          lastStatusText = "✅ Tanish odam: $knownPersonName (xavfsiz)"
                          updateNotif(lastStatusText)
                          if (now - lastKnownGreetingMs > 60_000L) {
                              lastKnownGreetingMs = now
                              pushEvent("face", "Tanish odam aniqlandi: $knownPersonName (xavf hisoblanmadi)")
                          }
                          return
                      }

                      lastRecognizedPerson = if (hasStrangerFace) "Notanish shaxs!" else ""
                      val srcTag = if (channelKey != null) {
                          targets.firstOrNull { it.key == channelKey }?.label ?: channelKey
                      } else {
                          if (facing == "user") "Oldi kamera" else "Orqa kamera"
                      }

                      // Yaqinlashtirilgan (Zoom) rasm tayyorlash: 1) Begona yuz -> 2) Odam tanasi -> 3) Harakat zonasi
                      var finalPhoto = jpegBytes
                      var zoomedTag = ""
                      if (fautoZoom) {
                          val zoomRect: Rect? = strangerFaceBox
                              ?: personBox
                              ?: motionNormBox?.let { nb ->
                                  Rect(
                                      (nb[0] * bmp.width).toInt(),
                                      (nb[1] * bmp.height).toInt(),
                                      (nb[2] * bmp.width).toInt(),
                                      (nb[3] * bmp.height).toInt()
                                  )
                              }
                          if (zoomRect != null) {
                              val zoomed = FaceProfileManager.cropAndZoomJpeg(bmp, zoomRect, imgQual)
                              if (zoomed != null && zoomed.size > 1024) {
                                  finalPhoto = zoomed
                                  zoomedTag = " [🔍 Yaqinlashtirilgan]"
                              }
                          }
                      }

                      val reason = if (hasStrangerFace) {
                          "🚨 Notanish shaxs [$srcTag]$zoomedTag"
                      } else {
                          "🚨 Harakat aniqlandi [$srcTag]$zoomedTag"
                      }

                      lastStatusText = reason
                      updateNotif(lastStatusText)
                      triggerDangerEpisode(reason, channelKey, finalPhoto)
                  } finally {
                      bmp.recycle()
                  }
              }

              private fun updateLineCrossingCounts(bmp: Bitmap, hasFace: Boolean, isKnownPerson: Boolean): Rect? {
                  var largestPersonBox: Rect? = null
                  try {
                      val objs = Tasks.await(objectDetector.process(InputImage.fromBitmap(bmp, 0)), 1200, TimeUnit.MILLISECONDS)
                      val midX = bmp.width * 0.5f
                      val activeIds = HashSet<Int>()
                      for (obj in objs) {
                          val box = obj.boundingBox
                          if (largestPersonBox == null || box.width() * box.height() > largestPersonBox.width() * largestPersonBox.height()) {
                              largestPersonBox = box
                          }
                          if (fcountStrangersOnly && isKnownPerson) continue
                          val tid = obj.trackingId ?: continue
                          activeIds.add(tid)
                          val cx = box.exactCenterX()
                          val prevX = trackedCentroids[tid]
                          trackedCentroids[tid] = cx
                          if (isKnownPerson) trackedStrangerFlag[tid] = false
                          else if (hasFace) trackedStrangerFlag[tid] = true

                          if (prevX != null && trackedCounted[tid] != true) {
                              val allowCount = !fcountStrangersOnly || (trackedStrangerFlag[tid] != false)
                              if (allowCount && prevX < midX && cx >= midX) {
                                  trackedCounted[tid] = true
                                  countEnterToday++
                                  SecureStore.saveCounts(this, todayKey(), countEnterToday, countExitToday)
                                  pushEvent("count", "➡️ Kirdi (Jami kirdi: $countEnterToday | Chiqdi: $countExitToday)")
                              } else if (allowCount && prevX > midX && cx <= midX) {
                                  trackedCounted[tid] = true
                                  countExitToday++
                                  SecureStore.saveCounts(this, todayKey(), countEnterToday, countExitToday)
                                  pushEvent("count", "⬅️ Chiqdi (Jami kirdi: $countEnterToday | Chiqdi: $countExitToday)")
                              }
                          }
                      }
                      trackedCentroids.keys.retainAll(activeIds)
                      trackedStrangerFlag.keys.retainAll(activeIds)
                      trackedCounted.keys.retainAll(activeIds)
                  } catch (_: Exception) {
                  }
                  return largestPersonBox
              }

              private fun yuv420ToNv21(image: ImageProxy): ByteArray {
                  val width = image.width
                  val height = image.height
                  val ySize = width * height
                  val uvSize = width * height / 2
                  val nv21 = ByteArray(ySize + uvSize)

                  val yPlane = image.planes[0]
                  val uPlane = image.planes[1]
                  val vPlane = image.planes[2]

                  val yBuffer = yPlane.buffer
                  val yRowStride = yPlane.rowStride
                  val yPixelStride = yPlane.pixelStride

                  var outIndex = 0
                  for (row in 0 until height) {
                      var yIdx = row * yRowStride
                      for (col in 0 until width) {
                          nv21[outIndex++] = if (yIdx >= 0 && yIdx < yBuffer.limit()) yBuffer.get(yIdx) else 0
                          yIdx += yPixelStride
                      }
                  }

                  val uBuffer = uPlane.buffer
                  val vBuffer = vPlane.buffer
                  val uRowStride = uPlane.rowStride
                  val vRowStride = vPlane.rowStride
                  val uPixelStride = uPlane.pixelStride
                  val vPixelStride = vPlane.pixelStride

                  val chromaHeight = height / 2
                  val chromaWidth = width / 2
                  for (row in 0 until chromaHeight) {
                      var vIdx = row * vRowStride
                      var uIdx = row * uRowStride
                      for (col in 0 until chromaWidth) {
                          nv21[outIndex++] = if (vIdx >= 0 && vIdx < vBuffer.limit()) vBuffer.get(vIdx) else 128.toByte()
                          nv21[outIndex++] = if (uIdx >= 0 && uIdx < uBuffer.limit()) uBuffer.get(uIdx) else 128.toByte()
                          vIdx += vPixelStride
                          uIdx += uPixelStride
                      }
                  }
                  return nv21
              }

              private fun imageProxyToJpeg(image: ImageProxy, quality: Int): ByteArray? {
                  return try {
                      val nv21 = yuv420ToNv21(image)
                      val yuvImage = YuvImage(nv21, ImageFormat.NV21, image.width, image.height, null)
                      val out = ByteArrayOutputStream()
                      yuvImage.compressToJpeg(Rect(0, 0, image.width, image.height), quality, out)
                      val rawJpeg = out.toByteArray()

                      val rot = image.imageInfo.rotationDegrees
                      if (rot == 0) return rawJpeg

                      val bmp = BitmapFactory.decodeByteArray(rawJpeg, 0, rawJpeg.size) ?: return rawJpeg
                      val m = Matrix().apply { postRotate(rot.toFloat()) }
                      val rotated = Bitmap.createBitmap(bmp, 0, 0, bmp.width, bmp.height, m, true)
                      bmp.recycle()
                      val out2 = ByteArrayOutputStream()
                      rotated.compress(Bitmap.CompressFormat.JPEG, quality, out2)
                      rotated.recycle()
                      out2.toByteArray()
                  } catch (_: Exception) {
                      null
                  }
              }

              private fun makeSmallPreview(jpeg: ByteArray): ByteArray {
                  return try {
                      val opts = BitmapFactory.Options().apply { inSampleSize = 3 }
                      val bmp = BitmapFactory.decodeByteArray(jpeg, 0, jpeg.size, opts) ?: return jpeg
                      val out = ByteArrayOutputStream()
                      bmp.compress(Bitmap.CompressFormat.JPEG, 60, out)
                      bmp.recycle()
                      out.toByteArray()
                  } catch (_: Exception) {
                      jpeg
                  }
              }

              private fun pollSingleChannel(t: CamTarget) {
                  val bytes = try {
                      CameraAuthClient.fetchSnapshotBytes(t.url, usr, pwd)
                  } catch (_: Exception) {
                      null
                  }

                  if (bytes == null || bytes.isEmpty()) {
                      val fails = (channelFailCount[t.key] ?: 0) + 1
                      channelFailCount[t.key] = fails
                      if (fails >= 3 && channelOffline[t.key] != true) {
                          channelOffline[t.key] = true
                          val downMsg = "⚠️ BUZG‘UNCHILIK / UZILISH: ${t.label} kamerasi o‘chdi!"
                          pushEvent("tamper", downMsg)
                          lastStatusText = downMsg
                          updateNotif(downMsg)
                          sendOrQueueText(downMsg)
                      }
                      return
                  }

                  channelFailCount[t.key] = 0
                  if (channelOffline[t.key] == true) {
                      channelOffline[t.key] = false
                      val upMsg = "✅ Kamera qayta ulandi: ${t.label}"
                      pushEvent("cam", upMsg)
                      sendOrQueueText(upMsg)
                  }

                  lastChannelJpeg[t.key] = bytes
                  latestFullJpeg.set(bytes)
                  if (uiVisible.get()) latestIpPreviewJpeg.set(makeSmallPreview(bytes))

                  val opts = BitmapFactory.Options().apply { inSampleSize = 4 }
                  val bmp = BitmapFactory.decodeByteArray(bytes, 0, bytes.size, opts) ?: return
                  val w = bmp.width.coerceAtLeast(1)
                  val h = bmp.height.coerceAtLeast(1)
                  val pixels = IntArray(w * h)
                  bmp.getPixels(pixels, 0, w, 0, 0, w, h)
                  bmp.recycle()

                  val gray = ByteArray(w * h)
                  var sumL = 0L
                  var minL = 255
                  var maxL = 0
                  for (i in pixels.indices) {
                      val p = pixels[i]
                      val r = (p ushr 16) and 0xFF
                      val g = (p ushr 8) and 0xFF
                      val b = p and 0xFF
                      val l = (r * 30 + g * 59 + b * 11) / 100
                      gray[i] = l.toByte()
                      sumL += l
                      if (l < minL) minL = l
                      if (l > maxL) maxL = l
                  }

                  val prev = lastGray[t.key]
                  lastGray[t.key] = gray
                  if (prev != null && prev.size == gray.size) {
                      var diff = 0
                      var sampled = 0
                      var minX = w
                      var minY = h
                      var maxX = 0
                      var maxY = 0
                      var i = 0
                      while (i < gray.size) {
                          sampled++
                          if (abs((gray[i].toInt() and 0xFF) - (prev[i].toInt() and 0xFF)) > 22) {
                              diff++
                              val gx = i % w
                              val gy = i / w
                              if (gx < minX) minX = gx
                              if (gx > maxX) maxX = gx
                              if (gy < minY) minY = gy
                              if (gy > maxY) maxY = gy
                          }
                          i += 3
                      }
                      val ratio = if (sampled > 0) (diff * 100.0) / sampled else 0.0
                      val threshold = (11 - sens) * 1.15
                      val avgL = sumL.toFloat() / gray.size.coerceAtLeast(1)

                      // NVR kamerani bo'yash / berkitishni aniqlash
                      if (ftamper && ratio > 85.0 && (maxL - minL) < 26 && (avgL < 16f || avgL > 242f)) {
                          val tMsg = "⚠️ BUZG‘UNCHILIK [${t.label}]: Kamera obyektivi berkitildi!"
                          pushEvent("tamper", tMsg)
                          triggerDangerEpisode(tMsg, t.key, bytes)
                          return
                      }

                      if (ratio > threshold) {
                          val normBox = if (maxX > minX && maxY > minY) {
                              floatArrayOf(
                                  minX.toFloat() / w,
                                  minY.toFloat() / h,
                                  maxX.toFloat() / w,
                                  maxY.toFloat() / h
                              )
                          } else null
                          analyzeBitmapForFacesAndCounting(bytes, System.currentTimeMillis(), t.key, normBox)
                      }
                  }
              }

