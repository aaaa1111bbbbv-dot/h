                  val lp = FrameLayout.LayoutParams(
                      FrameLayout.LayoutParams.MATCH_PARENT,
                      300,
                      Gravity.TOP or Gravity.CENTER_HORIZONTAL
                  )
                  root.addView(previewView, lp)
                  root.addView(
                      webView,
                      FrameLayout.LayoutParams(
                          FrameLayout.LayoutParams.MATCH_PARENT,
                          FrameLayout.LayoutParams.MATCH_PARENT
                      )
                  )

                  setContentView(root)
                  MonitorForegroundService.previewSurfaceProvider.set(previewView.surfaceProvider)
                  ensurePermissions()
              }

              override fun onResume() {
                  super.onResume()
                  MonitorForegroundService.uiVisible.set(true)
                  MonitorForegroundService.previewSurfaceProvider.set(previewView.surfaceProvider)
                  MonitorForegroundService.rebindCameraIfRunning()
              }

              override fun onPause() {
                  MonitorForegroundService.uiVisible.set(false)
                  MonitorForegroundService.previewSurfaceProvider.set(null)
                  MonitorForegroundService.rebindCameraIfRunning()
                  super.onPause()
