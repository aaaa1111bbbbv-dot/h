          package uz.qoriqlash.app

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          object OfflineQueue {
              private const val MAX_ITEMS = 60

              private fun dir(ctx: Context): File {
                  val d = File(ctx.filesDir, "tg_queue")
                  if (!d.exists()) d.mkdirs()
                  return d
              }

              private fun indexFile(ctx: Context): File = File(dir(ctx), "queue.json")

              @Synchronized
              fun enqueueText(ctx: Context, text: String) {
                  enqueueItem(ctx, "text", text, null)
              }

              @Synchronized
              fun enqueuePhoto(ctx: Context, jpeg: ByteArray, caption: String) {
                  try {
                      val name = "q_${System.currentTimeMillis()}_${(100..999).random()}.jpg"
                      File(dir(ctx), name).writeBytes(jpeg)
                      enqueueItem(ctx, "photo", caption, name)
                  } catch (_: Exception) {
                  }
              }

              @Synchronized
              fun enqueueVideo(ctx: Context, videoFile: File, caption: String) {
                  try {
                      if (!videoFile.exists()) return
                      val name = "v_${System.currentTimeMillis()}_${(100..999).random()}.mp4"
                      videoFile.copyTo(File(dir(ctx), name), overwrite = true)
                      enqueueItem(ctx, "video", caption, name)
                  } catch (_: Exception) {
                  }
              }

              private fun enqueueItem(ctx: Context, type: String, text: String, fileName: String?) {
                  try {
                      val arr = readArray(ctx)
                      while (arr.length() >= MAX_ITEMS) {
                          val old = arr.optJSONObject(0)
                          val oldFile = old?.optString("file", "") ?: ""
                          if (oldFile.isNotEmpty()) File(dir(ctx), oldFile).delete()
                          arr.remove(0)
                      }
                      arr.put(JSONObject().apply {
                          put("type", type)
                          put("text", text)
                          put("file", fileName ?: "")
                          put("ts", System.currentTimeMillis())
                      })
                      indexFile(ctx).writeText(arr.toString())
                  } catch (_: Exception) {
                  }
              }

              @Synchronized
              fun size(ctx: Context): Int = readArray(ctx).length()

              @Synchronized
              fun flush(
                  ctx: Context,
                  sendText: (String) -> Boolean,
                  sendPhoto: (ByteArray, String) -> Boolean,
                  sendVideo: (File, String) -> Boolean
              ): Int {
                  val arr = readArray(ctx)
                  if (arr.length() == 0) return 0
                  val remaining = JSONArray()
                  var sentCount = 0
                  var networkBroken = false

                  for (i in 0 until arr.length()) {
                      val item = arr.optJSONObject(i) ?: continue
                      if (networkBroken) {
                          remaining.put(item)
                          continue
                      }
                      val type = item.optString("type", "text")
                      val text = item.optString("text", "")
                      val fileName = item.optString("file", "")
                      val ok = when (type) {
                          "photo" -> {
                              val f = File(dir(ctx), fileName)
                              if (!f.exists()) true else sendPhoto(f.readBytes(), text).also { if (it) f.delete() }
                          }
                          "video" -> {
                              val f = File(dir(ctx), fileName)
                              if (!f.exists()) true else sendVideo(f, text).also { if (it) f.delete() }
                          }
                          else -> sendText(text)
                      }
                      if (ok) sentCount++ else {
                          networkBroken = true
                          remaining.put(item)
                      }
                  }
                  indexFile(ctx).writeText(remaining.toString())
                  return sentCount
              }

              private fun readArray(ctx: Context): JSONArray {
                  return try {
                      val f = indexFile(ctx)
                      if (!f.exists()) JSONArray() else JSONArray(f.readText())
                  } catch (_: Exception) {
                      JSONArray()
                  }
              }
          }
