                          Intent.ACTION_POWER_DISCONNECTED -> {
                              val pct = batteryPercent()
                              val msg = "⚡ Tashqi quvvat (220V/zaryad) uzildi! Batareya: $pct%"
                              pushEvent("power", msg)
                              sendOrQueueText(msg)
                              if (ftamper && active && !manualStopped) {
                                  triggerDangerEpisode("⚠️ Buzg‘unchilik: Tashqi quvvat uzildi!", null, latestFullJpeg.get())
                              }
                          }
                          Intent.ACTION_POWER_CONNECTED -> {
                              val pct = batteryPercent()
                              val msg = "🔌 Tashqi quvvat qayta ulandi ($pct%)"
                              pushEvent("power", msg)
                              sendOrQueueText(msg)
                          }
                      }
                  }
              }

              private fun todayKey(): String = SimpleDateFormat("yyyy-MM-dd", Locale.US).format(Date())

              private fun batteryPercent(): Int {
                  return try {
                      val bm = getSystemService(Context.BATTERY_SERVICE) as BatteryManager
                      bm.getIntProperty(BatteryManager.BATTERY_PROPERTY_CAPACITY)
                  } catch (_: Exception) {
                      -1
                  }
              }

              private fun pushEvent(type: String, text: String) {
                  val now = System.currentTimeMillis()
                  val fmt = SimpleDateFormat("dd.MM.yyyy HH:mm:ss", Locale.getDefault())
                  val obj = JSONObject().apply {
                      put("t", type)
                      put("x", text)
                      put("d", fmt.format(Date(now)))
                      put("ts", now)
                  }
                  synchronized(eventList) {
                      eventList.add(0, obj)
                      while (eventList.size > 300) eventList.removeAt(eventList.size - 1)
                      val arr = JSONArray()
                      for (item in eventList) arr.put(item)
                      eventsJson = arr.toString()
                  }
              }

              private fun videoArchiveDir(): File {
                  val base = getExternalFilesDir(Environment.DIRECTORY_MOVIES) ?: filesDir
                  val d = File(base, "QoriqlashVideos")
                  if (!d.exists()) d.mkdirs()
                  return d
              }

              private fun cleanupOldVideos() {
                  try {
                      val cutoff = System.currentTimeMillis() - archiveDays.coerceIn(1, 60) * 86_400_000L
                      videoArchiveDir().listFiles()?.forEach { f ->
                          if (f.isFile && f.lastModified() < cutoff) f.delete()
                      }
                  } catch (_: Exception) {
                  }
              }

              private fun triggerDangerEpisode(reason: String, channelKey: String?, preferredPhoto: ByteArray?) {
                  val now = System.currentTimeMillis()
                  lastDangerSignalMs = now
                  lastDangerReason = reason
                  if (channelKey != null) lastDangerChannelKey = channelKey
                  if (preferredPhoto != null && preferredPhoto.isNotEmpty()) {
                      latestZoomedAlertJpeg.set(preferredPhoto)
                  }

                  // 1. Foydalanuvchi tanlagan intervalda (masalan 1s yoki 5s) yaqinlashtirilgan rasm yuborish
                  val photoGapMs = alertPhotoIntervalSec.coerceIn(1, 60) * 1000L
                  if (now - lastAlertPhotoSentMs >= photoGapMs) {
                      val photoToSend = preferredPhoto ?: latestZoomedAlertJpeg.get() ?: latestFullJpeg.get()
                      if (photoToSend != null && photoToSend.isNotEmpty()) {
                          lastAlertPhotoSentMs = now
                          val kb = photoToSend.size / 1024
                          pushEvent("photo", "📸 Xavf rasmi (${alertPhotoIntervalSec}s rejim, ${kb}KB): $reason")
                          sendOrQueuePhoto(photoToSend, "$reason (${kb}KB)")
                      }
                  }

                  // 2. Birinchi xavf yoki har 4 soniyada 10 soniyali video boshlash
                  if (now - lastClipStartedMs >= videoRepeatEverySec * 1000L) {
                      lastClipStartedMs = now
                      startTenSecondClip(reason, channelKey)
                  }
              }

              private val dangerLoopRunnable = object : Runnable {
                  override fun run() {
                      if (active && !manualStopped) {
                          val now = System.currentTimeMillis()
                          // Xavf hali tinchimagan bo'lsa (oxirgi signalga 4.3 soniyadan oshmagan bo'lsa)
                          if (lastDangerSignalMs > 0L && (now - lastDangerSignalMs) <= 4300L) {
                              val photoGapMs = alertPhotoIntervalSec.coerceIn(1, 60) * 1000L
                              if (now - lastAlertPhotoSentMs >= photoGapMs) {
                                  val photoToSend = latestZoomedAlertJpeg.get() ?: latestFullJpeg.get()
                                  if (photoToSend != null && photoToSend.isNotEmpty()) {
                                      lastAlertPhotoSentMs = now
                                      sendOrQueuePhoto(photoToSend, "📸 Davom etayotgan xavf: $lastDangerReason")
                                  }
                              }
                              if (now - lastClipStartedMs >= videoRepeatEverySec * 1000L) {
                                  lastClipStartedMs = now
                                  startTenSecondClip(lastDangerReason, lastDangerChannelKey)
                              }
                          }
                      }
                      handler.postDelayed(this, 500L)
                  }
              }

              @SuppressLint("MissingPermission")
              private fun startTenSecondClip(reason: String, channelKey: String?) {
                  if (activeRecordingsCount.get() >= 3) return
                  val stamp = SimpleDateFormat("yyyyMMdd_HHmmss_SSS", Locale.US).format(Date())
                  val outFile = File(videoArchiveDir(), "ALERT_$stamp.mp4")

                  if (srcMode == "phone") {
                      val vc = videoCapture ?: return
                      activeRecordingsCount.incrementAndGet()
                      lastStatusText = "🎥 ${videoClipSec}s video: $reason"
                      updateNotif(lastStatusText)
                      pushEvent("video", "🎥 ${videoClipSec}s video boshlandi: $reason")

                      handler.post {
                          try {
                              val outputOptions = FileOutputOptions.Builder(outFile).build()
                              var pending = vc.output.prepareRecording(this, outputOptions)
                              if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED) {
                                  pending = pending.withAudioEnabled()
                              }
                              var recRef: Recording? = null
                              recRef = pending.start(ContextCompat.getMainExecutor(this)) { event ->
                                  if (event is VideoRecordEvent.Finalize) {
                                      activeRecordingsCount.decrementAndGet()
                                      if (!event.hasError() && outFile.exists() && outFile.length() > 2048) {
                                          sendOrQueueVideo(outFile, "🎥 ${videoClipSec}s Video: $reason")
                                      }
                                  }
                              }
                              handler.postDelayed({
                                  try {
                                      recRef?.stop()
                                  } catch (_: Exception) {
                                  }
                              }, videoClipSec * 1000L)
                          } catch (_: Exception) {
                              activeRecordingsCount.decrementAndGet()
                          }
                      }
                  } else {
                      val targetKey = channelKey ?: targets.firstOrNull()?.key ?: return
                      val label = targets.firstOrNull { it.key == targetKey }?.label ?: targetKey
                      activeRecordingsCount.incrementAndGet()
                      pushEvent("video", "🎥 NVR ${videoClipSec}s video [$label]: $reason")
                      videoBuilderExecutor.execute {
                          try {
                              val frames = mutableListOf<ByteArray>()
                              val endAt = System.currentTimeMillis() + videoClipSec * 1000L
                              while (System.currentTimeMillis() < endAt && active && !manualStopped) {
                                  val f = lastChannelJpeg[targetKey]
                                  if (f != null && f.isNotEmpty()) {
                                      frames.add(f)
                                  }
                                  Thread.sleep(250L)
                              }
                              if (frames.size >= 4 && JpegToMp4Encoder.encodeFramesToMp4(frames, outFile, fps = 4)) {
                                  sendOrQueueVideo(outFile, "🎥 NVR ${videoClipSec}s Video [$label]: $reason")
                              }
                          } catch (_: Exception) {
                          } finally {
                              activeRecordingsCount.decrementAndGet()
                          }
                      }
                  }
              }

              // Buzg'unchilik: telefonni silkitish / joyidan yulib olishni sezish
              override fun onSensorChanged(event: SensorEvent?) {
                  if (!ftamper || !active || manualStopped || !isScheduleOpen()) return
                  if (event?.sensor?.type == Sensor.TYPE_LINEAR_ACCELERATION) {
                      val ax = event.values[0]
                      val ay = event.values[1]
                      val az = event.values[2]
                      val mag = sqrt(ax * ax + ay * ay + az * az)
                      val thresh = (11 - sens.coerceIn(1, 10)) * 0.9 + 4.5
                      val now = System.currentTimeMillis()
                      if (mag > thresh && now - lastTamperMs > 2500L) {
                          lastTamperMs = now
                          val msg = "⚠️ BUZG‘UNCHILIK: Kamera/telefon silkitildi yoki qo‘zg‘atildi!"
                          pushEvent("tamper", msg)
                          triggerDangerEpisode(msg, null, latestFullJpeg.get())
                      }
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}

              private val nvrScheduleRunnable = object : Runnable {
                  override fun run() {
                      if (!active || manualStopped) return
                      if (srcMode == "ip" && isScheduleOpen() && targets.isNotEmpty()) {
                          for (t in targets) {
                              val flag = channelBusy.getOrPut(t.key) { AtomicBoolean(false) }
                              if (flag.compareAndSet(false, true)) {
                                  nvrExecutor.execute {
                                      try {
                                          pollSingleChannel(t)
                                      } catch (_: Exception) {
                                      } finally {
                                          flag.set(false)
                                      }
                                  }
                              }
                          }
                      }
                      handler.postDelayed(this, 750L)
                  }
              }

              private val burstRunnable = object : Runnable {
                  override fun run() {
                      if (!active || manualStopped || !burstActive) return
                      val now = System.currentTimeMillis()
                      if (burstEndMs > 0L && now >= burstEndMs) {
                          stopBurstInternal()
                          return
                      }
                      if (srcMode == "ip") {
                          val frame = latestFullJpeg.get()
                          if (frame != null && frame.isNotEmpty()) sendBurstFrame(frame)
                      }
                      handler.postDelayed(this, 1000L)
                  }
              }

              private fun sendBurstFrame(frame: ByteArray) {
                  burstCount++
                  burstSentCount = burstCount
                  val countNow = burstCount
                  val kb = frame.size / 1024
                  lastStatusText = "⚡ 1s/1 rasm: $countNow ta ($kb KB)"
                  updateNotif(lastStatusText)
                  pushEvent("photo", "1s rasm #$countNow [$kb KB]")
                  sendOrQueuePhoto(frame, "⚡ Fon 1s rasm #$countNow (${kb}KB)")
              }

              private val watchdogRunnable = object : Runnable {
                  override fun run() {
                      val now = System.currentTimeMillis()
                      tgExecutor.execute { flushOfflineQueue() }

                      if (active && !manualStopped) {
                          if (monitorEndMs > 0L && now >= monitorEndMs) {
                              stopAll(byUser = false)
                              return
                          }
                          if (fsched) {
                              val inside = isScheduleOpen()
                              if (inside && srcMode == "phone" && cameraProvider == null) {
                                  startCameraX()
                              } else if (!inside && cameraProvider != null) {
                                  stopCameraX()
                                  lastStatusText = "🕰 Jadval kutish rejimida ($tStart - $tEnd)"
                                  updateNotif(lastStatusText)
                              }
                          }
                          if (fheartbeat && now - lastHeartbeatMs >= 3600_000L) {
                              lastHeartbeatMs = now
                              val pct = batteryPercent()
                              val qSize = OfflineQueue.size(this@MonitorForegroundService)
                              val hb = "💚 Tizim faol | Kirdi: $countEnterToday, Chiqdi: $countExitToday | Batareya: $pct% | Navbat: $qSize"
                              pushEvent("sys", hb)
                              sendOrQueueText(hb)
                          }
                      }
                      handler.postDelayed(this, 5000L)
                  }
              }

              override fun onCreate() {
                  super.onCreate()
                  instance = this
                  createChannel()
                  val savedCounts = SecureStore.loadCounts(this, todayKey())
                  countEnterToday = savedCounts.first
                  countExitToday = savedCounts.second
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  accelSensor = sensorManager?.getDefaultSensor(Sensor.TYPE_LINEAR_ACCELERATION)
                  try {
                      val filter = IntentFilter().apply {
                          addAction(Intent.ACTION_POWER_DISCONNECTED)
                          addAction(Intent.ACTION_POWER_CONNECTED)
                      }
                      registerReceiver(powerReceiver, filter)
                  } catch (_: Exception) {
                  }
              }

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  super.onStartCommand(intent, flags, startId)
                  val action = intent?.action

                  if (action == ACTION_STOP) {
                      stopAll(byUser = true)
                      return START_NOT_STICKY
                  }
                  if (action == ACTION_CLEAR_LOG) {
                      synchronized(eventList) {
                          eventList.clear()
                          eventsJson = "[]"
                      }
                      return START_STICKY
                  }
                  if (action == ACTION_VIDEO_NOW) {
                      triggerDangerEpisode("Qo‘lda so‘ralgan video", null, latestFullJpeg.get())
                      return START_STICKY
                  }
                  if (action == ACTION_BURST) {
                      manualStopped = false
                      val enable = intent.getBooleanExtra("enable", false)
                      val sec = intent.getIntExtra("sec", 0)
                      if (enable) {
                          burstActive = true
                          isBurstRunning = true
                          burstCount = 0
                          burstSentCount = 0
                          lastBurstSentMs = 0L
                          burstEndMs = if (sec > 0) System.currentTimeMillis() + sec * 1000L else 0L
                          handler.removeCallbacks(burstRunnable)
                          handler.post(burstRunnable)
                      } else {
                          stopBurstInternal()
                      }
                      return START_STICKY
                  }
                  if (action == ACTION_SHOT) {
                      if (srcMode == "phone") {
                          pendingShotNow.set(true)
                      } else {
                          val frame = latestFullJpeg.get()
                          if (frame != null && frame.isNotEmpty()) {
                              pushEvent("photo", "Qo‘lda rasm yuborildi (${frame.size / 1024} KB)")
                              sendOrQueuePhoto(frame, "📸 Fon rasm (${frame.size / 1024}KB)")
                          }
                      }
                      return START_STICKY
                  }

                  val restoredFromVault = (intent == null || action == ACTION_RESTORE)
                  applyConfigFromVault()
                  manualStopped = false

                  if (restoredFromVault && !SecureStore.wasRunning(this)) {
                      stopSelf()
                      return START_NOT_STICKY
                  }

                  SecureStore.setWasRunning(this, true)
                  acquireWakeLock()
                  cleanupOldVideos()

                  val reason = intent?.getStringExtra("reason") ?: ""
                  val initText = if (srcMode == "phone") {
                      "Aqlli himoya (${alertPhotoIntervalSec}s rasm + ${videoClipSec}s video)"
                  } else {
                      "NVR / IP himoyada (${targets.size} kanal parallel)"
                  }
                  lastStatusText = initText
                  startFgCompat(buildNotif(initText))

                  active = true
                  isRunning = true
                  lastHeartbeatMs = System.currentTimeMillis()
                  monitorEndMs = if (durSec > 0) System.currentTimeMillis() + durSec * 1000L else 0L

                  if (reason == "boot" || intent == null) {
                      val bootMsg = if (reason == "boot") {
                          "🔄 Telefon qayta yondi — Qo‘riqlash avtomatik ishga tushdi"
                      } else {
                          "🛡 Fon xizmati tiklandi — Qo‘riqlash davom etmoqda"
                      }
                      pushEvent("sys", bootMsg)
                      sendOrQueueText(bootMsg)
                  }

                  if (srcMode == "phone") {
                      if (isScheduleOpen()) startCameraX() else stopCameraX()
                  } else {
                      stopCameraX()
                  }

                  if (ftamper && accelSensor != null) {
                      sensorManager?.registerListener(this, accelSensor, SensorManager.SENSOR_DELAY_NORMAL)
                  } else {
                      sensorManager?.unregisterListener(this)
                  }

                  startAudioMonitorIfNeeded()
                  startTelegramBotLoop()
                  handler.removeCallbacks(nvrScheduleRunnable)
                  handler.post(nvrScheduleRunnable)
                  handler.removeCallbacks(dangerLoopRunnable)
                  handler.post(dangerLoopRunnable)
                  handler.removeCallbacks(watchdogRunnable)
                  handler.post(watchdogRunnable)

                  return START_STICKY
              }

              private fun startAudioMonitorIfNeeded() {
                  if (!faudio) {
                      audioDetector?.stop()
                      audioDetector = null
                      return
                  }
                  if (audioDetector == null) {
                      audioDetector = DangerAudioDetector(this) { label, _ ->
                          if (!active || manualStopped || !isScheduleOpen()) return@DangerAudioDetector
                          pushEvent("audio", "$label aniqlandi!")
                          triggerDangerEpisode(label, null, latestFullJpeg.get())
                      }
                  }
                  audioDetector?.sensitivity = sens
                  audioDetector?.enabled = true
                  audioDetector?.start()
              }

              private fun applyConfigFromVault() {
                  val cfg = SecureStore.loadConfig(this)
                  srcMode = cfg.optString("src", "phone")
                  facing = cfg.optString("facing", "environment")
                  tok = cfg.optString("tok", "").trim()
                  cid = cfg.optString("cid", "").trim()
                  usr = cfg.optString("usr", "").trim()
                  pwd = cfg.optString("pwd", "").trim()
                  sens = cfg.optInt("sens", 7).coerceIn(1, 10)
                  imgQual = ((cfg.optDouble("imgQual", 0.88)) * 100).toInt().coerceIn(55, 95)
                  durSec = cfg.optInt("dur", 0).coerceAtLeast(0)
                  fsched = cfg.optBoolean("fsched", false)
                  tStart = cfg.optString("tStart", "08:00")
                  tEnd = cfg.optString("tEnd", "22:00")
                  fpower = cfg.optBoolean("fpower", true)
                  fheartbeat = cfg.optBoolean("fheartbeat", false)
                  faudio = cfg.optBoolean("faudio", true)
                  ftamper = cfg.optBoolean("ftamper", true)
                  fautoZoom = cfg.optBoolean("fautoZoom", true)
                  ffaceIgnoreKnown = cfg.optBoolean("ffaceIgnoreKnown", true)
                  fcountStrangersOnly = cfg.optBoolean("fcountStrangersOnly", true)
                  alertPhotoIntervalSec = cfg.optInt("alertPhotoIntervalSec", 2).coerceIn(1, 60)
                  videoClipSec = cfg.optInt("videoClipSec", 10).coerceIn(5, 30)
                  videoRepeatEverySec = cfg.optInt("videoRepeatEverySec", 4).coerceIn(3, 15)
                  archiveDays = cfg.optInt("archiveDays", 5).coerceIn(1, 60)
                  targets = buildTargetsFromConfig(cfg)
              }

              private fun buildTargetsFromConfig(cfg: JSONObject): List<CamTarget> {
                  val br = cfg.optString("br", "hik")
                  if (br == "url") {
                      return cfg.optString("ip", "")
                          .split('\n', ',')
                          .map { it.trim() }
                          .filter { it.isNotEmpty() }
                          .mapIndexed { i, u -> CamTarget("u_$i", "URL #${i + 1}", u) }
                  }
                  val ips = cfg.optString("ipa", "")
                      .split('\n', ',')
                      .map { it.trim() }
                      .filter { it.isNotEmpty() }
                  val chRaw = cfg.optString("chs", "1")
                  val prt = cfg.optString("prt", "").trim()
                  val channels = parseChannels(chRaw)
                  val list = mutableListOf<CamTarget>()
                  for (ip in ips) {
                      val cleanIp = ip.trimEnd('/')
                      val withProto = if (cleanIp.startsWith("http://", true) || cleanIp.startsWith("https://", true)) cleanIp else "http://$cleanIp"
                      val hasPort = Regex(":\\d+$").containsMatchIn(withProto)
                      val base = if (prt.isNotEmpty() && prt != "80" && !hasPort) "$withProto:$prt" else withProto
                      for (ch in channels) {
                          val url = if (br == "dahua") {
                              "$base/cgi-bin/snapshot.cgi?channel=$ch"
                          } else {
                              "$base/ISAPI/Streaming/channels/${ch * 100 + 1}/picture"
                          }
                          list.add(CamTarget("${ip}_$ch", "$ip (kan $ch)", url))
                      }
                  }
                  return list
              }

              private fun parseChannels(raw: String): List<Int> {
                  val set = LinkedHashSet<Int>()
                  for (part in raw.split(',', ' ', '\n').map { it.trim() }.filter { it.isNotEmpty() }) {
                      val m = Regex("^(\\d+)-(\\d+)$").matchEntire(part)
                      if (m != null) {
                          val a = m.groupValues[1].toInt().coerceIn(1, 64)
                          val b = m.groupValues[2].toInt().coerceIn(1, 64)
                          for (n in a..b) set.add(n)
                      } else {
                          part.toIntOrNull()?.let { set.add(it.coerceIn(1, 64)) }
                      }
                  }
                  return if (set.isEmpty()) listOf(1) else set.toList()
              }

              override fun onTaskRemoved(rootIntent: Intent?) {
                  super.onTaskRemoved(rootIntent)
                  if (active && !manualStopped && SecureStore.wasRunning(this)) {
                      try {
                          val restartIntent = Intent(applicationContext, MonitorForegroundService::class.java).apply {
                              action = ACTION_RESTORE
                              putExtra("reason", "task_removed")
                          }
                          if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                              applicationContext.startForegroundService(restartIntent)
                          } else {
                              applicationContext.startService(restartIntent)
                          }
                      } catch (_: Exception) {
                      }
                  }
              }

              private fun startFgCompat(notif: Notification) {
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.Q) {
                      var types = ServiceInfo.FOREGROUND_SERVICE_TYPE_DATA_SYNC
                      if (srcMode == "phone" &&
                          ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) == PackageManager.PERMISSION_GRANTED
                      ) {
                          types = types or ServiceInfo.FOREGROUND_SERVICE_TYPE_CAMERA
                      }
                      if (faudio &&
                          ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) == PackageManager.PERMISSION_GRANTED
                      ) {
                          types = types or ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE
                      }
                      startForeground(NOTIF_ID, notif, types)
                  } else {
                      startForeground(NOTIF_ID, notif)
                  }
              }

              private fun stopBurstInternal() {
                  burstActive = false
                  isBurstRunning = false
                  handler.removeCallbacks(burstRunnable)
                  lastStatusText = if (srcMode == "phone") "Aqlli himoya faol" else "NVR / IP himoyada"
                  if (active && !manualStopped) updateNotif(lastStatusText)
              }

              private fun stopAll(byUser: Boolean) {
                  if (byUser) {
                      manualStopped = true
                      SecureStore.setWasRunning(this, false)
                  }
                  active = false
                  isRunning = false
                  botLoopRunning.set(false)
                  sensorManager?.unregisterListener(this)
                  audioDetector?.stop()
                  audioDetector = null
                  stopBurstInternal()
                  handler.removeCallbacks(nvrScheduleRunnable)
                  handler.removeCallbacks(dangerLoopRunnable)
                  handler.removeCallbacks(watchdogRunnable)
                  stopCameraX()
                  releaseWakeLock()
                  lastStatusText = "O‘chiq"
                  stopForeground(STOP_FOREGROUND_REMOVE)
                  stopSelf()
              }

              override fun onDestroy() {
                  instance = null
                  active = false
                  isRunning = false
                  botLoopRunning.set(false)
                  sensorManager?.unregisterListener(this)
                  audioDetector?.stop()
                  try {
                      unregisterReceiver(powerReceiver)
                  } catch (_: Exception) {
                  }
                  stopCameraX()
                  releaseWakeLock()
                  cameraExecutor.shutdown()
                  nvrExecutor.shutdown()
                  tgExecutor.shutdown()
                  videoBuilderExecutor.shutdown()
                  botPollExecutor.shutdown()
                  super.onDestroy()
              }

              private fun acquireWakeLock() {
                  try {
                      if (wakeLock == null) {
                          val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                          wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "Qoriqlash::BgWakeLock")
                      }
                      if (wakeLock?.isHeld == false) wakeLock?.acquire(24 * 60 * 60 * 1000L)
                  } catch (_: Exception) {
                  }
              }

              private fun releaseWakeLock() {
                  try {
                      if (wakeLock?.isHeld == true) wakeLock?.release()
                  } catch (_: Exception) {
                  }
              }

              private fun parseMins(hhmm: String): Int? {
                  val parts = hhmm.split(":")
                  if (parts.size != 2) return null
                  val h = parts[0].toIntOrNull() ?: return null
                  val m = parts[1].toIntOrNull() ?: return null
                  if (h !in 0..23 || m !in 0..59) return null
                  return h * 60 + m
              }

              private fun isScheduleOpen(): Boolean {
                  if (!fsched) return true
                  val s = parseMins(tStart) ?: return true
                  val e = parseMins(tEnd) ?: return true
                  if (s == e) return true
                  val cal = Calendar.getInstance()
                  val cur = cal.get(Calendar.HOUR_OF_DAY) * 60 + cal.get(Calendar.MINUTE)
                  return if (s < e) cur in s until e else (cur >= s || cur < e)
              }

              private fun startCameraX() {
                  if (ContextCompat.checkSelfPermission(this, Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED) {
                      lastStatusText = "❌ Kamera ruxsati berilmagan"
                      updateNotif(lastStatusText)
                      return
                  }
                  val future = ProcessCameraProvider.getInstance(this)
                  future.addListener({
                      try {
                          val provider = future.get()
                          cameraProvider = provider
                          provider.unbindAll()

                          val analysis = ImageAnalysis.Builder()
                              .setTargetResolution(Size(960, 720))
                              .setBackpressureStrategy(ImageAnalysis.STRATEGY_KEEP_ONLY_LATEST)
                              .build()

                          analysis.setAnalyzer(cameraExecutor) { image ->
                              processPhoneFrame(image)
                          }

                          val recorder = Recorder.Builder()
                              .setQualitySelector(QualitySelector.from(Quality.SD))
                              .build()
                          videoCapture = VideoCapture.withOutput(recorder)

                          val selector = if (facing == "user") {
                              CameraSelector.DEFAULT_FRONT_CAMERA
                          } else {
                              CameraSelector.DEFAULT_BACK_CAMERA
                          }

                          val sp = if (uiVisible.get()) previewSurfaceProvider.get() else null
                          if (sp != null) {
                              val preview = Preview.Builder()
                                  .setTargetResolution(Size(1280, 720))
                                  .build()
                              preview.setSurfaceProvider(sp)
                              provider.bindToLifecycle(this, selector, preview, analysis, videoCapture)
                          } else {
                              provider.bindToLifecycle(this, selector, analysis, videoCapture)
                          }

                          lastStatusText = "📷 Aqlli himoya (${alertPhotoIntervalSec}s rasm + ${videoClipSec}s video)"
                          updateNotif(lastStatusText)
                      } catch (e: Exception) {
                          lastStatusText = "❌ Kamera ochilmadi: ${e.message}"
                          updateNotif(lastStatusText)
                      }
                  }, ContextCompat.getMainExecutor(this))
              }

