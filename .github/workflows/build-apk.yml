                  @JavascriptInterface
                  fun promptBiometric(purpose: String) {
                      activity.runOnUiThread {
                          try {
                              val bm = BiometricManager.from(activity)
                              val canAuth = bm.canAuthenticate(BiometricManager.Authenticators.BIOMETRIC_WEAK)
                              if (canAuth != BiometricManager.BIOMETRIC_SUCCESS) {
                                  webView.evaluateJavascript("window.onBioResult('$purpose', false);", null)
                                  return@runOnUiThread
                              }
                              val executor = ContextCompat.getMainExecutor(activity)
                              val prompt = BiometricPrompt(
                                  activity,
                                  executor,
                                  object : BiometricPrompt.AuthenticationCallback() {
                                      override fun onAuthenticationSucceeded(result: BiometricPrompt.AuthenticationResult) {
                                          webView.evaluateJavascript("window.onBioResult('$purpose', true);", null)
                                      }
                                      override fun onAuthenticationError(errorCode: Int, errString: CharSequence) {
                                          webView.evaluateJavascript("window.onBioResult('$purpose', false);", null)
                                      }
                                  }
                              )
                              val info = BiometricPrompt.PromptInfo.Builder()
                                  .setTitle("Qo‘riqlash tasdig‘i")
                                  .setSubtitle("Barmoq izi yoki yuz bilan tasdiqlang")
                                  .setNegativeButtonText("PIN kiritish")
                                  .build()
                              prompt.authenticate(info)
                          } catch (_: Exception) {
                              webView.evaluateJavascript("window.onBioResult('$purpose', false);", null)
                          }
                      }
                  }

                  @JavascriptInterface
                  fun detectChatId(token: String) {
                      Thread {
                          var foundId = ""
                          var foundUser = ""
                          try {
                              val client = OkHttpClient.Builder()
                                  .connectTimeout(5, TimeUnit.SECONDS)
                                  .readTimeout(8, TimeUnit.SECONDS)
                                  .build()
                              val req = Request.Builder()
                                  .url("https://api.telegram.org/bot${token.trim()}/getUpdates?limit=20")
                                  .build()
                              client.newCall(req).execute().use { resp ->
                                  if (resp.isSuccessful) {
                                      val root = JSONObject(resp.body?.string() ?: "")
                                      if (root.optBoolean("ok", false)) {
                                          val arr = root.optJSONArray("result") ?: JSONArray()
                                          for (i in arr.length() - 1 downTo 0) {
                                              val item = arr.optJSONObject(i) ?: continue
                                              val msg = item.optJSONObject("message") ?: item.optJSONObject("channel_post") ?: continue
                                              val chat = msg.optJSONObject("chat") ?: continue
                                              val id = chat.optLong("id", 0L)
                                              if (id != 0L) {
                                                  foundId = id.toString()
                                                  foundUser = chat.optString("username", chat.optString("first_name", ""))
                                                  break
                                              }
                                          }
                                      }
                                  }
                              }
                          } catch (_: Exception) {
                          }
                          val escId = foundId.replace("'", "")
                          val escUser = foundUser.replace("\\", "\\\\").replace("'", "\\'")
                          activity.runOnUiThread {
                              webView.evaluateJavascript("window.onChatIdDetected('$escId', '$escUser');", null)
                          }
                      }.start()
                  }

